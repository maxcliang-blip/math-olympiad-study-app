// ===== AIME Mock Exam engine =====
const MOCK_LEN = 15;
const MOCK_MS = 3 * 60 * 60 * 1000; // 3 hours
let mock = JSON.parse(localStorage.getItem("mmock") || "{}");
if (!mock.amc) mock.amc = 110;
if (!mock.cutoff) mock.cutoff = 216;
if (!mock.history) mock.history = [];
let mockSolOpen = {};
function mockSave() { localStorage.setItem("mmock", JSON.stringify(mock)); }
function mockBand(nm, prompt) {
  // Difficulty bands mirroring a real AIME: 1 = #1-5 (easy), 2 = #6-10 (mid), 3 = #11-15 (hard)
  if (/AIME 1-3|AIME 1-5/.test(nm)) return 1;
  if (/AIME 3-8/.test(nm)) return 2;
  if (/AIME-Style/.test(nm)) return 2;
  if (/AIME 10|USAJMO/.test(nm)) return 3;
  if (/Challenge/.test(nm)) return 2;
  // Real AIME problems (aime-* sets): use the problem number when it's in the prompt
  const m = prompt.match(/#\s*(\d+)/);
  if (m) { const n = +m[1]; return n <= 5 ? 1 : n <= 10 ? 2 : 3; }
  return 2; // unmarked real AIME problems sit mid-exam on average
}
function mockPool() {
  const pool = { 1: [], 2: [], 3: [] };
  for (const sec of SECTIONS) {
    if (sec.type !== "prac") continue;
    const real = sec.id.indexOf("aime-") === 0;
    for (const l of sec.levels || []) {
      const nm = l.n || "";
      if (!real && !/AIME|Challenge/.test(nm)) continue; // AIME tiers + real AIME sets only
      for (const p of l.probs || []) {
        if (!p) continue;
        const b = mockBand(nm, p[1]);
        if (b) pool[b].push({ sid: sec.id, pid: p[0], prompt: p[1], sol: p[2], ans: p[3], band: b });
      }
    }
  }
  return pool;
}
function mockShuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function startMock() {
  const pool = mockPool();
  // Stratified draw: 5 easy (#1-5) + 5 mid (#6-10) + 5 hard (#11-15), like the real exam.
  // If the hard band is thin, top it up from the mid band so the exam is always 15.
  const bands = [pool[1], pool[2], pool[3]];
  const picked = [];
  for (let bi = 0; bi < 3; bi++) {
    if (bi < 2 || bands[2].length >= 5) {
      picked.push.apply(picked, mockShuffle(bands[bi].slice()).slice(0, 5));
    } else {
      // Hard band is thin: take ALL hard problems first, then top up the
      // remaining slots from the mid band (never lets the shuffle drop them).
      picked.push.apply(picked, bands[2].slice());
      picked.push.apply(picked, mockShuffle(bands[1].slice()).slice(0, 5 - bands[2].length));
    }
  }
  const seen = {}, probs = [];
  for (const p of picked) {
    const k = p.sid + "|" + p.pid;
    if (seen[k]) continue;
    seen[k] = 1;
    probs.push(Object.assign({}, p));
    if (probs.length === MOCK_LEN) break;
  }
  // Rare collision in the fill slots (same problem drawn twice across bands):
  // top up from the mid band until the exam is complete.
  for (const p of mockShuffle(bands[1].slice())) {
    if (probs.length === MOCK_LEN) break;
    const k = p.sid + "|" + p.pid;
    if (seen[k]) continue;
    seen[k] = 1;
    probs.push(Object.assign({}, p, { band: 2 }));
  }
  probs.sort((x, y) => x.band - y.band); // difficulty ramp: easy → mid → hard
  mock.active = { start: Date.now(), probs, answers: {}, submitted: false, score: null };
  mockSolOpen = {};
  mockSave();
  render();
}
function mockRemaining() {
  if (!mock.active) return 0;
  return Math.max(0, MOCK_MS - (Date.now() - mock.active.start));
}
function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h + ":" + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}
function mockAns(i, val) {
  if (!mock.active || mock.active.submitted) return;
  mock.active.answers[i] = val.trim();
  mockSave();
  const el = document.getElementById("m-status-" + i);
  if (el) el.textContent = val.trim() ? "Answered" : "Blank";
  if (el) el.className = "mock-status" + (val.trim() ? " answered" : "");
}
function submitMock(auto) {
  if (!mock.active || mock.active.submitted) return;
  const a = mock.active;
  let score = 0;
  a.probs.forEach((p, i) => {
    const u = a.answers[i] || "";
    if (u && matchAns(u, p.ans)) score++;
  });
  a.submitted = true;
  a.score = score;
  const index = mock.amc + 20 * score;
  mock.history.unshift({
    date: new Date().toISOString().slice(0, 10),
    time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
    score, amc: mock.amc, cutoff: mock.cutoff, index, pass: index >= mock.cutoff, auto: !!auto
  });
  mock.history = mock.history.slice(0, 40);
  mockSave();
  render();
}
function abandonMock() {
  if (mock.active && !mock.active.submitted && !confirm("Abandon this mock exam? Progress will be lost.")) return;
  delete mock.active;
  mockSave();
  render();
}
function renderMock(main, sec) {
  let html = '<h2>' + sec.title + '</h2><p class="subtitle">' + sec.sub + '</p>';
  if (!mock.active) {
    html += '<div class="mock-hero"><h3>Take a timed AIME</h3>';
    html += '<p>15 problems drawn from the AIME tiers across all topics. 3-hour countdown, auto-submit at zero.</p>';
    html += '<p>Projected USAJMO index = AMC 10 score + 20 &times; AIME score. The cutoff varies by year — adjust it to the current cycle.</p><p class="mock-note">Full-range exam: 5 easy (AIME #1-5), 5 mid (#6-10), 5 hard (#11-15) — drawn from the AIME tiers across all topics plus real AIME problems, presented in increasing difficulty like the real test. The hard band draws from real AIME problems (e.g. 2016 AIME II #15) and tops up from the mid band when thin.</p></div>';
    html += '<div class="mock-row">';
    html += '<div class="mock-field"><label>Your AMC 10 score (0-150)</label><input id="mock-amc" type="number" min="0" max="150" value="' + mock.amc + '"></div>';
    html += '<div class="mock-field"><label>USAJMO cutoff</label><input id="mock-cutoff" type="number" min="0" max="450" value="' + mock.cutoff + '"></div>';
    html += '</div>';
    html += '<button class="btn btn-primary" onclick="mock.amc=Math.min(150,Math.max(0,+document.getElementById(\'mock-amc\').value||0));mock.cutoff=Math.min(450,Math.max(0,+document.getElementById(\'mock-cutoff\').value||0));mockSave();startMock()">Start Mock Exam</button> ';
    html += '<button class="btn" onclick="mock.amc=Math.min(150,Math.max(0,+document.getElementById(\'mock-amc\').value||0));mock.cutoff=Math.min(450,Math.max(0,+document.getElementById(\'mock-cutoff\').value||0));mockSave();render()">Save Settings</button>';
    const best = mock.history.length ? Math.max.apply(null, mock.history.map(h => h.score)) : null;
    html += '<div class="mock-stat-grid">';
    html += '<div class="mock-stat"><div class="v">' + mock.history.length + '</div><div class="k">mocks taken</div></div>';
    html += '<div class="mock-stat"><div class="v">' + (best === null ? "&ndash;" : best + "/15") + '</div><div class="k">best score</div></div>';
    const recent = mock.history[0];
    html += '<div class="mock-stat"><div class="v">' + (recent ? recent.index : "&ndash;") + '</div><div class="k">last projected index</div></div>';
    html += '</div>';
    if (mock.history.length) {
      html += '<h3 style="margin-top:18px">History</h3><table class="mock-hist"><tr><th>Date</th><th>Score</th><th>AMC</th><th>Cutoff</th><th>Index</th><th>Result</th></tr>';
      mock.history.forEach(h => {
        html += '<tr><td>' + h.date + ' ' + h.time + (h.auto ? ' (auto)' : '') + '</td><td>' + h.score + '/15</td><td>' + h.amc + '</td><td>' + h.cutoff + '</td><td>' + h.index + '</td><td class="' + (h.pass ? 'pass' : 'fail') + '">' + (h.pass ? 'Qualify' : 'Missed') + '</td></tr>';
      });
      html += '</table>';
    }
    main.innerHTML = html;
    return;
  }
  const a = mock.active;
  if (!a.submitted) {
    const rem = mockRemaining();
    const warn = rem < 30 * 60 * 1000;
    html += '<div class="mock-timer' + (warn ? ' warn' : '') + '"><span>Time left</span><span class="t" id="mock-t">' + fmtTime(rem) + '</span><span style="flex:1"></span>';
    html += '<button class="btn btn-primary" onclick="submitMock(false)">Submit Exam</button>';
    html += '<button class="btn" onclick="abandonMock()">Abandon</button></div>';
    html += '<div class="mock-grid">';
    a.probs.forEach((p, i) => {
      const ans = a.answers[i] || "";
      html += '<div class="mock-prob"><div class="mock-prob-head"><span class="mock-num">' + (i + 1) + '.</span><span class="mock-status' + (ans ? ' answered' : '') + '" id="m-status-' + i + '">' + (ans ? 'Answered' : 'Blank') + '</span></div>';
      html += '<p style="margin:0 0 6px">' + R(p.prompt) + '</p>';
      html += '<input class="ans-input mock-ans" type="text" placeholder="Answer" value="' + ans + '" oninput="mockAns(' + i + ',this.value)">';
      html += '</div>';
    });
    html += '</div><p style="margin-top:14px"><button class="btn btn-primary" onclick="submitMock(false)">Submit Exam</button></p>';
    main.innerHTML = html;
    return;
  }
  // Results
  const index = mock.amc + 20 * a.score;
  const pass = index >= mock.cutoff;
  html += '<div class="mock-stat-grid">';
  html += '<div class="mock-stat"><div class="v">' + a.score + '/15</div><div class="k">AIME score</div></div>';
  html += '<div class="mock-stat"><div class="v">' + mock.amc + '</div><div class="k">AMC 10</div></div>';
  html += '<div class="mock-stat"><div class="v">' + index + '</div><div class="k">projected index (AMC + 20&times;AIME)</div></div>';
  html += '<div class="mock-stat"><div class="v">' + mock.cutoff + '</div><div class="k">cutoff</div></div>';
  html += '</div>';
  html += '<div class="mock-verdict ' + (pass ? 'pass' : 'fail') + '">' + (pass ? '&#10003; On pace to qualify for USAJMO' : '&#10007; Need ' + (mock.cutoff - index) + ' more points — AIME is the lever (20 pts each)') + '</div>';
  html += '<div class="mock-row"><button class="btn btn-primary" onclick="startMock()">New Mock</button><button class="btn" onclick="delete mock.active;mockSave();render()">Back to Home</button></div>';
  a.probs.forEach((p, i) => {
    const u = a.answers[i] || "";
    const ok = u && matchAns(u, p.ans);
    const sk = 'mocksol-' + i;
    html += '<div class="card" style="margin-top:10px"><div class="card-top">';
    html += '<div class="num' + (ok ? ' done' : '') + '">' + (ok ? '&#10003;' : '&#10007;') + '</div>';
    html += '<div class="card-body"><p>' + R(p.prompt) + '</p>';
    html += '<p style="color:var(--muted);font-size:13px">Your answer: <b>' + (u || '&mdash; blank') + '</b> &nbsp;|&nbsp; Expected: <b>' + R(p.ans.split('|')[0]) + '</b></p>';
    html += '<button class="btn" onclick="mockSolOpen[' + i + ']=!mockSolOpen[' + i + '];renderMock(document.getElementById(\'main\'),SECTIONS.find(x=>x.id===\'aime-mock\'))">' + (mockSolOpen[i] ? 'Hide' : 'Show') + ' Solution</button>';
    if (mockSolOpen[i]) html += '<div class="hints" style="margin-top:8px"><div class="hint-item">' + R(p.sol || "No solution text.") + '</div></div>';
    html += '</div></div></div>';
  });
  main.innerHTML = html;
}

setInterval(() => {
  if (mock.active && !mock.active.submitted) {
