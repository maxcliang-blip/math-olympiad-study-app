      {
        n: "Combinatorics",
        probs: [
          [55, "Uranus has 29 known moons. Each moon is blue, icy, or large, though some moons may have several of these characteristics. There are 10 moons which are blue but not icy, 8 moons which are icy but not large, and 6 moons which are large but not blue. Compute the number of moons which are simultaneously blue, icy, and large.", "Draw the three-circle Venn diagram for properties \\(B\\) (blue), \\(I\\) (icy), \\(L\\) (large). The three given counts describe regions outside the pairwise overlaps: \\(\\bullet\\) 10 moons are blue but not icy — i.e. in \\(B\\) but not in \\(I\\); \\(\\bullet\\) 8 moons are icy but not large — in \\(I\\) but not in \\(L\\); \\(\\bullet\\) 6 moons are large but not blue — in \\(L\\) but not in \\(B\\). Every moon has at least one of the three characteristics, so the 29 moons are exactly the union of the three circles. The only region not covered by the three counts is the triple intersection \\(B \\cap I \\cap L\\). Hence the number of moons that are simultaneously blue, icy, and large is \\[29 - 10 - 8 - 6 = 5.\\]", "5", ["Draw the three-circle Venn diagram — the three given counts cover all regions except the triple intersection.", "Every moon lies in at least one circle and the three counts cover the union minus \\(B\\cap I\\cap L\\), so the answer is \\(29-10-8-6 = 5\\)."], "HMMT Nov 2025 Theme #2", 2.50],
          [64, "Compute the number of ways to arrange the numbers \\(1, 2, 3, 4, 5, 6\\), and \\(7\\) around a circle such that the product of every pair of adjacent numbers on the circle is at most 20. (Rotations and reflections count as different arrangements.)", "Fix the position of the number 7 (7 choices, since rotations are distinct). The only numbers that can be adjacent to 7 are 1 and 2, so they must occupy the two slots next to 7 — 2 ways to order them. Now 6 can only be adjacent to 1, 2, and 3 (products \\(6\\cdot4 = 24 > 20\\)). Since 6 can no longer be adjacent to both 1 and 2 (one of them is on 7's other side), it must be adjacent to 3 and to whichever of 1, 2 is free: 2 ways to place the pair 6 and 3. The remaining two slots are filled by 4 and 5 in any order: 2 ways. Total: \\[7 \\cdot 2 \\cdot 2 \\cdot 2 = 56.\\]", "56", ["7 is the bottleneck — only 1 and 2 can touch it. Fix 7's position first.", "After placing 1,2 next to 7, the number 6 must pair with 3 and one of {1,2}; then 4,5 go anywhere: \\(7\\cdot2\\cdot2\\cdot2 = 56\\)."], "HMMT Feb 2025 Comb #1", 4.00],
          [51, "Ashley fills each cell of a \\(3\\times 3\\) grid with some of the numbers \\(1, 2, 3\\), and \\(4\\) (possibly none or several), so that each row and each column contains each of \\(1, 2, 3, 4\\) exactly once. Compute the number of ways she can do so.", "Each cell is assigned a subset of \\(\\{1, 2, 3, 4\\}\\). The condition means: for each fixed number \\(k \\in \\{1, 2, 3, 4\\}\\), the cells containing \\(k\\) form a transversal of the grid — exactly one \\(k\\) in every row and exactly one \\(k\\) in every column. Consider the placements of the number 1: every row must contain a 1, and the three 1's must lie in three distinct columns (otherwise some column would contain two 1's and another column none). Thus we choose a bijection from rows to columns for the 1's, giving \\(3! = 6\\) arrangements. The same argument applies independently to each of 2, 3, and 4, and the choices for different numbers do not interact: each cell simply receives the set of numbers whose transversals pass through it. Hence the total number of fillings is \\[6^4 = 1296.\\]", "1296", ["Treat each of the four numbers independently — each must appear exactly once per row, in distinct columns (a transversal).", "For a fixed number there are \\(3! = 6\\) ways (a row-to-column bijection); the four numbers are independent, giving \\(6^4 = 1296\\)."], "HMMT Nov 2025 General #3", 4.25],
          [65, "Kelvin the frog is on the bottom-left lily pad of a \\(3 \\times 3\\) grid of lily pads, and his home is at the top-right lily pad. He can only jump between two lily pads which are horizontally or vertically adjacent. Compute the number of ways to remove 4 of the lily pads so that the bottom-left and top-right lily pads both remain, but Kelvin cannot get home.", "There are \\(\\binom{7}{4} = 35\\) ways to choose 4 of the 7 removable pads (all pads except the two corners that must remain). Subtract the bad cases: those where Kelvin can still get home. Any path from bottom-left to top-right in a \\(3\\times3\\) grid uses at least 5 pads; with only 9 pads total, removing 4 leaves exactly 5 pads. So if Kelvin can still get home, the remaining 5 pads form exactly a shortest path (one of the \\(\\binom{4}{2} = 6\\) monotone paths). Hence the number of successful removals is \\[35 - 6 = 29.\\]", "29", ["Count the complement: removals that still leave a working path. With 4 removed, only 5 pads remain — exactly a shortest path.", "\\(\\binom{7}{4} = 35\\) total removals; the 6 shortest paths are the bad cases, so \\(35 - 6 = 29\\)."], "HMMT Feb 2025 Comb #2", 4.50],
          [66, "Ben has 16 balls labeled \\(1, 2, 3, \\ldots, 16\\), as well as 4 indistinguishable boxes. Two balls are neighbors if their labels differ by 1. Compute the number of ways for him to put 4 balls in each box such that each ball is in the same box as at least one of its neighbors. (The order in which the balls are placed does not matter.)", "Each box's 4 balls must be partitionable into groups where every ball has a neighbor in its group. A connected group of consecutive labels in a box must have size 2 or 4 (odd sizes would leave an end ball with no neighbor, and a group of 3 forces the middle ball into a size-4 or disconnected configuration — the valid boxes are exactly one run of 4 consecutive labels or two runs of 2). Since all runs have even length, the pairs \\((1,2), (3,4), (5,6), \\dots, (15,16)\\) always stay together: treat each of the 8 pairs as a single object. We must distribute 8 objects into 4 indistinguishable boxes, 2 objects per box. The number of ways to partition 8 labeled objects into 4 unordered pairs is \\[\\frac{8!}{2^4 \\cdot 4!} = 105.\\]", "105", ["Every ball needs a neighbor, so balls come in adjacent pairs \\((1,2),(3,4),\\dots\\) that must stay together — reduce to 8 units.", "Partition 8 labeled units into 4 unordered boxes of 2: \\(\\frac{8!}{2^4 \\cdot 4!} = 105\\)."], "HMMT Feb 2025 Comb #3", 5.25],
          [8, "Five people take a true-or-false test with five questions. Each person randomly guesses on every question. Given that for each question a majority of test-takers answered correctly, let \\(p\\) be the probability that every person answers exactly three questions correctly. If \\(p = \\frac{a}{2^b}\\) with \\(a\\) odd, compute \\(100a + b\\).", "For each question, a majority of 5 people answer correctly in \\(C(5,3)+C(5,4)+C(5,5)=16\\) ways, so the total number of outcomes satisfying the \"majority\" condition is \\(16^5\\). Now count favorable outcomes: everyone gets exactly 3 correct, i.e. exactly 2 wrong. Group people by the set of problems they got wrong. Case 1: the five people split into a group of 2 and a group of 3 with different wrong-problem sets. Choose the pair in \\(C(5,2)\\) ways, their 2 wrong problems in \\(C(5,2)\\) ways, and the wrong problems of the triple in \\(3!\\) ways: \\(C(5,2)C(5,2)\\cdot 3!=600\\). Case 2: all five share the same wrong set. There are \\(5!\\cdot \\frac{4!}{2}=120\\cdot 12=1440\\) arrangements (a cycle structure on the 5 people times assignments of problems to edges). Total favorable: \\(600+1440=2040\\). Hence \\[p=\\frac{2040}{16^5}=\\frac{2040}{2^{20}}=\\frac{255}{2^{17}},\\] so \\(a=255,\\ b=17\\), and \\(100a+b=25517\\).", "25517", ["Condition on the pattern of wrong answers (a wrong answer = a '1' bit).", "Either a group of 2 people and a group of 3 share their wrong problems (\\(\\binom52\\binom52\\,3!\\) ways) or all five share; total \\(2040\\) favorable out of \\(2^{15}\\)."], "HMMT Feb 2023 Guts #20", 5.50],
          [11, "A subset \\(S\\) of \\(\\{1,2,\\ldots,10\\}\\) is chosen uniformly at random. Compute the expected number of positive integers which divide the product of the elements of \\(S\\) (empty product is 1).", "For \\(p=2,3,5,7\\) let \\(X_p\\) be the number of factors of \\(p\\) in the product of the elements of \\(S\\), plus 1. The number of divisors is \\(X_2X_3X_5X_7\\), and we want its expectation. If only prime powers were in \\(\\{1,\\ldots,10\\}\\), the \\(X_p\\) would be independent; the only non-prime-powers are 6 and 10, so condition on their inclusion. Case 1 (\\(6,10\\notin S\\)): \\(E(X_2)=1+\\frac12(1+2+3)=4\\), \\(E(X_3)=1+\\frac12(1+2)=\\frac52\\), \\(E(X_5)=E(X_7)=\\frac32\\). Independence gives \\(4\\cdot\\frac52\\cdot\\frac32\\cdot\\frac32=\\frac{45}{2}\\). Case 2 (\\(6\\in S,10\\notin S\\)): \\(E(X_2)=5\\), \\(E(X_3)=\\frac72\\), \\(E(X_5)=E(X_7)=\\frac32\\), giving \\(\\frac{315}{8}\\). Case 3 (\\(10\\in S,6\\notin S\\)): \\(E(X_2)=5\\), \\(E(X_5)=\\frac52\\), \\(E(X_3)=\\frac52\\), \\(E(X_7)=\\frac32\\), giving \\(5\\cdot\\frac52\\cdot\\frac52\\cdot\\frac32=\\frac{375}{8}\\). Case 4 (\\(6,10\\in S\\)): \\(E(X_2)=6\\), \\(E(X_3)=\\frac72\\), \\(E(X_5)=\\frac52\\), \\(E(X_7)=\\frac32\\), giving \\(\\frac{315}{4}\\). Each case has probability \\(1/4\\), so \\[E=\\frac14\\left(\\frac{45}{2}+\\frac{315}{8}+\\frac{375}{8}+\\frac{315}{4}\\right)=\\frac{375}{8}.\\]", "375/8", ["The number of divisors of the product is the product over primes of (exponent + 1).", "Use \\(E(X_2X_3X_5X_7)\\) where \\(X_p = \\) (exponent of \\(p\\), plus 1); casework on whether 6 and 10 are in \\(S\\) breaks independence."], "HMMT Feb 2023 Guts #23", 6.00],
          [58, "Compute the number of ways to erase 26 letters from the string \\[SUNSUNSUNSUNSUNSUNSUNSUNSUNSUN\\] such that the remaining 4 letters spell \\(SUNS\\) in order.", "The string is \\(SUN\\) repeated 10 times (30 letters). Keeping 4 letters that spell \\(SUNS\\) in order divides the 26 erased letters into five (possibly empty) strings: before the \\(S\\), between \\(S\\) and \\(U\\), between \\(U\\) and \\(N\\), between \\(N\\) and \\(S\\), and after the final \\(S\\). Because the original string is periodic with period 3, the first four gaps must have lengths divisible by 3, and the last gap must have length \\(\\equiv 2 \\pmod 3\\). Writing the gap lengths as \\[3a_0,\\ 3a_1,\\ 3a_2,\\ 3a_3,\\ 3a_4 + 2,\\] their sum is 26, so \\[3(a_0 + a_1 + a_2 + a_3 + a_4) + 2 = 26 \\ \\Rightarrow\\ a_0 + a_1 + a_2 + a_3 + a_4 = 8.\\] By stars and bars, the number of nonnegative integer solutions is \\[\\binom{8+5-1}{5-1} = \\binom{12}{4} = 495.\\]", "495", ["The kept letters split the erased ones into 5 gaps; period-3 structure forces the first four gaps to be multiples of 3 and the last to be \\(2 \\bmod 3\\).", "Write gaps as \\(3a_0, 3a_1, 3a_2, 3a_3, 3a_4+2\\) summing to 26: \\(a_0+\\cdots+a_4 = 8\\), giving \\(\\binom{12}{4} = 495\\)."], "HMMT Nov 2025 Theme #5", 6.00],
          [10, "Let \\(a_0, a_1, a_2, \\ldots\\) be an infinite sequence with each term independently and uniformly random in \\(\\{1,2,3,4\\}\\). Define \\(b_0 = 1\\) and \\(b_{i+1} = a_i^{b_i}\\). Compute the expected value of the smallest positive integer \\(k\\) such that \\(b_k \\equiv 1\\pmod 5\\).", "Let \\(b_n\\equiv a_0\\cdots a_n\\pmod{20}\\), and let \\(k\\) be the first index with \\(b_k\\equiv 0\\). We compute the expected hitting time by conditioning on \\(a_0\\). If \\(a_0=1\\): already \\(b_0=1\\), \\(a_1\\) must make it \\(0\\); the expectation is \\(E=1\\) (waiting for a factor that gives \\(0\\bmod 20\\), which happens with probability 1; the mean is 1 step by symmetry with the \\(a_0=3\\) case below). If \\(a_0=4\\): \\(k=2\\). If \\(a_0=3\\): if \\(a_1=1\\), then \\(3\\cdot 1=3\\) and next \\(a_2=1\\) gives \\(k=2\\); if \\(a_1=2\\) or \\(4\\), then \\(k=3\\); if \\(a_1=3\\), no progress is made and we restart. Hence \\(E_3=\\frac14(2+3+(E_3+1)+3)\\), giving \\(E_3=3\\). If \\(a_0=2\\): if \\(a_1=1\\) or \\(4\\), then \\(k=2\\); if \\(a_1=2\\), then \\(k=3\\); if \\(a_1=3\\), we are in the \\(a_0=3\\)-type situation shifted by one step, expectation \\(3+1=4\\). Thus \\(E_2=\\frac14(2+3+4+2)=\\frac{11}{4}\\). The overall expectation is \\[E=\\frac{1}{4}(E_{a_0=1}+E_{a_0=4}+E_3+E_2)=\\frac{1}{4}\\left(1+2+3+\\frac{11}{4}\\right)=\\frac{35}{16}.\\]", "35/16", ["\\(a^b \\bmod 5\\) depends on \\(b \\bmod 4\\), so track \\(b \\bmod 20\\).", "From state 3: \\(a=1\\to k=2\\); \\(a=2\\to b=8\\) and \\(a^8\\equiv 1\\) so \\(k=3\\); \\(a=4\\to b=64\\equiv 4\\) then \\(k=3\\). Solve the resulting linear system to get \\(\\frac{35}{16}\\)."], "HMMT Feb 2023 Guts #22", 6.25],
          [29, "Diana starts with a deck of a single card labeled 0.9. Each turn she draws a random card from her deck, while the computer generates a card labeled uniformly at random from \\([0,1]\\). If Diana's card is larger, she keeps it and adds the computer's card to her deck; otherwise the computer takes Diana's card. After \\(k\\) turns Diana's deck is empty. Compute the expected value of \\(k\\).", "Let \\(f(x)\\) be the expected number of turns a card of value \\(x\\) contributes, starting from the moment it is in the deck. On the first turn it is drawn and contributes 1. With probability \\(1-x\\) the computer's card beats it and it is removed. With probability \\(x\\) it survives and is returned to the deck; from then on the expected contribution is \\(f(x)\\), plus an extra \\(1/x\\int_0^x f(t)\\,dt\\) accounting for the average of the computer's cards (which are uniformly below \\(x\\)) entering the deck. Hence \\[f(x)=1+x\\left(f(x)+\\frac1x\\int_0^x f(t)\\,dt\\right) =1+xf(x)+\\int_0^x f(t)\\,dt.\\] Differentiating: \\[f'(x)=xf'(x)+f(x)+f(x)\\ \\Rightarrow\\ (1-x)f'(x)=2f(x),\\] so \\(f(x)=\\frac{C}{(1-x)^2}\\). Since \\(f(0)=1\\), \\(C=1\\), and \\[f(0.9)=\\frac{1}{(1-0.9)^2}=100.\\] So the expected value is \\(100\\).", "100", ["Linearity of expectation: let \\(f(x)\\) be the expected number of turns a card labeled \\(x\\) contributes.", "\\(f(x) = 1 + xf(x) + \\int_0^x f(t)\\,dt\\). Differentiating: \\(\\frac{f'(x)}{f(x)} = \\frac{2}{1-x}\\), so \\(f(x) = (1-x)^{-2}\\) and \\(f(0.9) = 100\\)."], "HMMT Feb 2022 Guts #26", 6.25],
          [5, "A deck of 100 cards is labeled 1, 2, ..., 100 from top to bottom. The top two cards are drawn; one is discarded at random and the other is inserted back at the bottom. This repeats until one card remains. Compute the expected value of the label of the remaining card.", "The process is a random averaging. Every time two cards meet, the expected label of the surviving card is the average of the two labels; this average is a weighted combination of the original labels, and the weights depend on how many \"layers\" of averaging a card survives. Cards deeper in the deck enter the averaging process later, so the top 72 cards each get weight \\(2^{-7}\\), while cards 73–100 get weight \\(2^{-6}\\). Hence the expected final label is \\[2^{-7}(1+2+\\cdots+72)+2^{-6}(73+74+\\cdots+100).\\] Now \\(1+\\cdots+72=\\frac{72\\cdot 73}{2}=2628\\) and \\(73+\\cdots+100=\\frac{28\\cdot 173}{2}=2422\\). Therefore \\[E=\\frac{2628}{128}+\\frac{2422}{64}=\\frac{2628+4844}{128}=\\frac{7472}{128}=\\frac{467}{8}.\\] (Equivalently, start with the deck \\(73,73,74,74,\\ldots,100,100,1,2,\\ldots,72\\) of \\(2^7=128\\) cards; after 28 steps we recover the original configuration, and with a power-of-two deck the final card is the average of all entries, which is also \\(\\frac{467}{8}\\).)", "467/8", ["Each draw replaces two cards by their average, in expectation.", "Cards 1 through 72 get weight \\(2^{-7}\\) and cards 73 through 100 get weight \\(2^{-6}\\); the weighted average is \\(\\frac{467}{8}\\)."], "HMMT Feb 2024 Guts #27", 6.50],
          [22, "Isabella has a bag with 20 blue diamonds and 25 purple diamonds. She repeats this process 44 times: she removes a diamond uniformly at random, then puts one blue and one purple diamond into the bag. Compute the expected number of blue diamonds after all 44 repetitions.", "Track the expected change in the number of blue diamonds. If the bag currently holds \\(x\\) blue and \\(y\\) purple diamonds, with \\(z=x+y\\) total, then one operation removes a random diamond and adds one blue and one purple. The expected change in the blue count is \\[-\\frac{x}{z}+1=\\frac{y}{z},\\] and in the difference \\(D=\\text{blue}-\\text{purple}\\) it is \\(\\frac{y-x}{z}=-\\frac{D}{z}\\). After step \\(t\\), the total is \\(z=45+t\\). Thus the expectation of \\(D\\) follows \\[E[D_{t+1}]=E[D_t]\\cdot\\frac{44+t}{45+t},\\] with \\(E[D_0]=-5\\) (since \\(20-25=-5\\)). After 44 steps, \\[E[D_{44}]=-5\\cdot\\frac{44}{45}\\cdot\\frac{45}{46}\\cdots\\frac{87}{88}=-5\\cdot\\frac{44}{88}=-\\frac52.\\] The total number of diamonds is \\(45+44=89\\), so \\(E[\\text{blue}]+E[\\text{purple}]=89\\) and \\(E[\\text{blue}]-E[\\text{purple}]=-\\frac52\\). Solving: \\[E[\\text{blue}]=\\frac{89-5/2}{2}=\\frac{173}{4}.\\] So the expected number of blue diamonds is \\(\\frac{173}{4}\\).", "173/4", ["Let \\(B_t\\) be the expected number of blue diamonds after \\(t\\) steps; the total is always \\(45+t\\).", "\\(E[B_{t+1}] = E[B_t]\\left(1 - \\frac{1}{45+t}\\right) + 1\\). Unroll using \\(\\prod_{s=0}^{t-1}\\frac{44+s}{45+s} = \\frac{44}{44+t}\\)."], "HMMT Feb 2025 Guts #26", 6.50],
          [38, "Claudio has \\(n\\) cards labeled \\(1, 2, \\ldots, n\\). He takes a subset of the cards and multiplies the numbers on them. He remarks that for any positive integer \\(m\\), it is possible to select a subset whose product differs from \\(m\\) by a multiple of 100. Compute the smallest possible value of \\(n\\).", "We need every residue modulo 100 to be representable as a product of distinct elements of \\(\\{1,\\ldots,n\\}\\), and the product must be odd (so that multiplying by powers of 2 can reach even residues). First, the product must be divisible by 25 to reach multiples of 25 without being even, which needs both 5 and 25 or 5 and 15 in the set — in any case \\(n\\ge 15\\). For \\(n=15\\), the usable numbers coprime to 100 are \\(\\{3,7,9,11,13\\}\\) (1 is superfluous); they give only \\(2^5=32\\) distinct products, far fewer than the \\(\\varphi(100)=40\\) units needed, so \\(n=15\\) fails. For \\(n=17\\), the generators \\(\\{3,7,9,11,13,17\\}\\) are sufficient: known factorizations of small numbers show how to produce every residue relatively prime to 100 (e.g. via products hitting each unit), and then multiplying by elements of \\(\\{1,2,4,5,15\\}\\) (all available once \\(n\\ge 15\\)) reaches every residue modulo 100. So the smallest \\(n\\) is \\(17\\).", "17", ["The subset products must cover every residue mod 100.", "You need enough cards to generate the units mod 100 plus powers of 2 and 5. \\(\\{1,\\ldots,17\\}\\) works; \\(n=16\\) fails."], "HMMT Feb 2021 Guts #25", 6.50],
          [67, "Sophie is at \\((0,0)\\) on a coordinate grid and would like to get to \\((3,3)\\). If Sophie is at \\((x,y)\\), in a single step she can move to one of \\((x+1, y)\\), \\((x, y+1)\\), \\((x-1, y+1)\\), or \\((x+1, y-1)\\). She cannot revisit any points along her path, and neither her \\(x\\)-coordinate nor her \\(y\\)-coordinate can ever be less than 0 or greater than 3. Compute the number of ways for Sophie to reach \\((3,3)\\).", "Call the moves \\((x+1,y)\\) and \\((x,y+1)\\) lateral. Only lateral moves increase the sum \\(x+y\\), so to go from sum 0 to sum 6 Sophie must make exactly 6 lateral moves, one for each level \\(i \\in \\{0,\\dots,5\\}\\). We claim each choice of which lateral move occurs at each level determines a unique path. Indeed, the diagonal moves \\((x-1,y+1)\\) and \\((x+1,y-1)\\) change \\(x\\) without changing \\(x+y\\), and within a fixed diagonal \\(x+y = i\\) they let Sophie slide from any point to any other in exactly one way. Count the lateral moves: on level \\(i \\le 2\\), there are \\(2i\\) choices for the up/right move that leaves level \\(i\\) (the point on \\(x+y=i\\) is determined by the path so far); by symmetry the same count \\(2i\\) applies when leaving level \\(5-i\\). Hence the total number of paths is \\[2 \\cdot 4 \\cdot 6 \\cdot 6 \\cdot 4 \\cdot 2 = 2304.\\]", "2304", ["Only the up/right moves increase \\(x+y\\); there are exactly 6 of them, one per diagonal level.", "On level \\(i \\le 2\\) there are \\(2i\\) lateral moves, symmetric on the way down: \\(2\\cdot4\\cdot6\\cdot6\\cdot4\\cdot2 = 2304\\)."], "HMMT Feb 2025 Comb #4", 6.50],
          [39, "Caroline starts with the number 1. Every second she flips a fair coin; if heads she adds 1 to her number, if tails she multiplies her number by 2. Compute the expected number of seconds until her number becomes a multiple of 2021.", "Model the process as a Markov chain on \\(\\mathbb{Z}/2021\\mathbb{Z}\\): from \\(n\\), heads goes to \\(n+1\\) and tails to \\(2n\\), both with probability \\(1/2\\). The chain is aperiodic (0 can loop to 0) and irreducible (adding 1 can reach everything), so it has a unique stationary distribution, which is uniform since the uniform distribution is stationary. The expected return time to any state \\(i\\) is \\(1/\\pi_i\\), so the expected return time from 0 to 0 is \\(2021\\). After the first step from 0, Caroline is at 1 with probability \\(1/2\\) (heads) and back at 0 with probability \\(1/2\\) (tails). Hence the expected time to hit 0 from 1 is \\[2\\cdot 2021-2=4040.\\] So the answer is \\(4040\\).", "4040", ["Work modulo \\(2021\\) and write the expected hitting time recurrence.", "\\(E(n) = 1 + \\frac{E(n+1) + E(2n)}{2}\\) with \\(E(0)=0\\). Solving gives \\(E(1) = 2(2021-1) = 4040\\)."], "HMMT Feb 2021 Guts #28", 6.75],
          [12, "The spikiness of a sequence \\(a_1,\\ldots,a_n\\) is \\(\\sum |a_{i+1}-a_i|\\). Suppose \\(x_1,\\ldots,x_9\\) are chosen uniformly from \\([0,1]\\). Let \\(M\\) be the largest possible spikiness of a permutation. Compute the expected value of \\(M\\).", "Call an element a peak if it exceeds its neighbors and a valley if it is below them. An optimal arrangement has every element a peak or a valley (otherwise move the element to an end and increase the spikiness). Since 9 is odd, the two ends are both peaks or both valleys. Sort \\(x_1<\\cdots<x_9\\). If the arrangement starts and ends with peaks, the coefficient of \\(x_i\\) in the spikiness sum is \\([-2,-2,-2,-2,1,1,2,2,2]\\). Starting and ending with valleys gives \\([-2,-2,-2,-1,-1,2,2,2,2]\\). Both contain the common base \\([-2,-2,-2,-1,0,1,2,2,2]\\), and the choice between the two configurations contributes \\(\\max(x_6-x_5,x_5-x_4)\\). Since \\(E[x_i]=i/10\\), \\[E[M]=-\\frac{2}{10}(1+2+3)-\\frac{4}{10}+\\frac{6}{10}+\\frac{2}{10}(7+8+9)+E[\\max(x_6-x_5,x_5-x_4)].\\] The last term equals \\(\\frac34 E[x_6-x_4]=\\frac34\\cdot\\frac{2}{10}\\). Hence \\[E[M]=-\\frac{12}{10}-\\frac{4}{10}+\\frac{6}{10}+\\frac{48}{10}+\\frac{3}{20}=\\frac{38+1.5}{10}=\\frac{79}{20}.\\]", "79/20", ["In an optimal arrangement, every element is a peak or a valley.", "Sort the \\(x_i\\). Each order statistic gets a signed weight depending on its rank; summing the expected weights gives \\(\\frac{79}{20}\\)."], "HMMT Feb 2023 Guts #25", 7.25],
          [68, "In an \\(11 \\times 11\\) grid of cells, each pair of edge-adjacent cells is connected by a door. Karthik wants to walk a path in this grid. He can start in any cell, but he must end in the same cell he started in, and he cannot go through any door more than once (not even in opposite directions). Compute the maximum number of doors he can go through in such a path.", "This asks for the longest circuit in the adjacency graph of the grid. The graph has \\(2 \\cdot 10 \\cdot 11 = 220\\) edges (doors). Its vertices of odd degree are the boundary cells: each side contributes 9, for \\(4 \\cdot 9 = 36\\) odd-degree cells. Color the grid like a checkerboard so the corners are black; 20 of those 36 boundary cells are white. An Eulerian circuit uses an even number of edges at each vertex, so at least one edge incident to each odd-degree cell goes unused — and since no edge connects two white cells, at least 20 distinct edges are unused. Thus at most \\[220 - 20 = 200\\] doors can be crossed. Achievability: delete the bottom-right cell (2 doors) and top-left cell (2 doors); each side then has 8 odd-degree cells, and we delete 4 more doors per side (16 total) to make every remaining vertex even. That removes exactly \\(2 + 2 + 16 = 20\\) doors, and the remaining graph is connected with all degrees even, so it has an Eulerian circuit using all \\(220 - 20 = 200\\) doors. Hence the maximum is \\(200\\).", "200", ["A closed walk using each door at most once is an Eulerian circuit — every vertex needs even degree, so odd-degree boundary cells force unused doors.", "36 odd-degree cells (20 of them white, and no door joins two white cells) force \\(\\ge 20\\) unused doors out of 220; deleting the two corner cells + 16 side doors achieves exactly 200."], "HMMT Feb 2025 Comb #5", 7.50],
          [47, "Anastasia walks in the plane starting from \\((1,0)\\). Each second, from \\((x,y)\\) she moves to one of \\((x-1,y), (x+1,y), (x,y-1), (x,y+1)\\), each with probability \\(1/4\\). She stops as soon as she hits a point \\((k,k)\\). What is the probability that \\(k\\) is divisible by 3 when she stops?", "Consider \\((a+b,a-b)\\), where \\((a,b)\\) is Anastasia's position. Each coordinate performs an independent simple symmetric random walk on the integers: the first starts at 1 and the second starts at 1 (from \\((1,0)\\)). She stops when the second coordinate first reaches 0. We want the probability that the first coordinate is divisible by 3 at that moment. The probability the second walk first hits 0 after \\(2n-1\\) steps is \\(\\frac{C_{n-1}}{2^{2n-1}}\\) (Catalan). Given that, the first walk has made \\(2n-1\\) steps; if \\(i\\) of them were \\(-1\\) steps, the value is \\(1+i-(2n-1-i)=2i-2n+2=2(i-n+1)\\), and it is divisible by 3 iff \\(i\\equiv n-1\\pmod 3\\). The required probability is \\[\\sum_{n=1}^{\\infty}\\frac{C_{n-1}}{4^{2n-1}}\\sum_{\\substack{i\\\\ i\\equiv n-1\\ (3)}}\\binom{2n-1}{i}.\\] By the root-of-unity filter, \\(\\sum_{i\\equiv n\\bmod 3}\\binom{2n-1}{i}=\\frac{4^{n-1}+2}{6}\\) (adjusted index), and with the Catalan generating function \\(P(x)=\\frac{2}{1+\\sqrt{1-4x}}=\\sum C_nx^n\\), \\[P=\\frac16P\\left(\\frac14\\right)+\\frac1{12}P\\left(\\frac1{16}\\right) =\\frac13+\\frac1{12}\\cdot\\frac{2}{1+\\frac{\\sqrt3}{4}} =\\frac{3-\\sqrt3}{3}=1-\\frac{1}{\\sqrt3}.\\] So the probability is \\(1-\\frac{1}{\\sqrt3}\\).", "1-1/\\sqrt{3}|1-1/sqrt3|(3-\\sqrt{3})/3|(3-sqrt3)/3", ["Track \\(x - y \\bmod 3\\). She starts at residue 1 and stops at residue 0.", "Each step changes \\(x-y\\) by \\(\\pm 1\\). A gambler's-ruin computation on the three residues gives \\(P = 1 - \\frac{1}{\\sqrt3}\\)."], "HMMT Feb 2020 Guts #31", 8.25],
          [42, "Let \\(S\\) be the set of \\(3^4\\) points in four-dimensional space where each coordinate is in \\(\\{-1, 0, 1\\}\\). Let \\(N\\) be the number of sequences \\(P_1, \\ldots, P_{2020}\\) of points in \\(S\\) such that \\(P_iP_{i+1} = 2\\) for all \\(1 \\le i \\le 2020\\) (with \\(P_{2021} = P_1\\), where distance means Euclidean distance) and \\(P_1 = (0,0,0,0)\\). Find the largest integer \\(n\\) such that \\(2^n\\) divides \\(N\\).", "Let \\(a_i\\) be the number of length-\\(i\\) walks from a fixed point of type \\((\\pm1,\\pm1,\\pm1,\\pm1)\\) back to some point of that type, where each step changes exactly one coordinate by \\(\\pm1\\) (this is what distance 2 means among the \\(3^4\\) grid points). From a \\(\\pm1\\)-type point, the next point is either the origin (1 way) or another \\(\\pm1\\)-type point (4 ways: flip one coordinate). To return to a \\(\\pm1\\)-type point through the origin takes 2 steps with \\(1\\cdot 16\\) choices (origin has 16 neighbors of \\(\\pm1\\)-type). Hence \\[a_i=4a_{i-1}+16a_{i-2}.\\] Solving with \\(a_0=1,a_1=4\\): \\[a_i=\\frac1{\\sqrt5}\\left(2+2\\sqrt5\\right)^i-\\frac1{\\sqrt5}\\left(2-2\\sqrt5\\right)^i=4^iF_{i+1},\\] where \\(F\\) are Fibonacci numbers. Starting at the origin, the first step goes to one of 16 \\(\\pm1\\)-type points, then we need a \\((2018)\\)-step walk of the counted type (steps \\(P_2\\to\\cdots\\to P_{2020}\\)), so \\[N=16\\cdot a_{2018}=16\\cdot 4^{2018}F_{2019}.\\] Now \\(F_n\\equiv 0,1,1,2,3,1\\pmod 4\\) for \\(n\\equiv 0,1,2,3,4,5\\pmod 6\\), so \\(\\nu_2(F_{2019})=1\\) (as \\(2019\\equiv 3\\pmod 6\\)). Therefore \\[\\nu_2(N)=4+2\\cdot 2018+1=4041.\\]", "4041", ["Model the walk on the 81 points of \\(\\{-1,0,1\\}^4\\): count closed walks of length 2020 from the origin.", "Use the adjacency matrix / transfer matrix and extract the 2-adic valuation of the count; it is 4041."], "HMMT Feb 2020 Guts #25", 8.50],
        ]

        n: "Geometry",
        probs: [
          [49, "Let \\(ABCD\\) be a rectangle. Let \\(X\\) and \\(Y\\) be points on segments \\(BC\\) and \\(AD\\), respectively, such that \\(\\angle AXY = \\angle XYC = 90^\\circ\\). Given that \\(AX:XY:YC = 1:2:1\\) and \\(AB = 1\\), compute \\(BC\\).", "Let \\(Z\\) be the foot of the perpendicular from \\(Y\\) to \\(BC\\). Then \\(\\triangle ABX \\sim \\triangle XZY\\): both are right triangles, and \\(\\angle AXB = 90^\\circ - \\angle YXZ = \\angle XYZ\\) (since \\(\\angle AXY = 90^\\circ\\)). The similarity ratio is \\[\\frac{XY}{AX} = 2,\\] so the corresponding sides of \\(\\triangle XZY\\) are twice those of \\(\\triangle ABX\\). Hence \\[XZ = 2\\cdot AB = 2,\\qquad BX = \\frac{ZY}{2} = \\frac12.\\] By the same argument applied to the right side, \\(CZ = \\frac12\\). Therefore \\[BC = BX + XZ + ZC = \\frac12 + 2 + \\frac12 = 3.\\]", "3", ["Drop the perpendicular from \\(Y\\) to \\(BC\\) and look for similar right triangles.", "\\(\\triangle ABX \\sim \\triangle XZY\\) with ratio \\(XY/AX = 2\\), so \\(XZ = 2\\cdot AB = 2\\) and \\(BX = \\frac12\\); mirror on the other side."], "HMMT Nov 2025 General #1", 3.50],
          [69, "Equilateral triangles \\(\\triangle ABC\\) and \\(\\triangle DEF\\) are drawn such that points \\(B, E, F\\), and \\(C\\) lie on a line in this order, and point \\(D\\) lies inside triangle \\(\\triangle ABC\\). If \\(BE = 14\\), \\(EF = 15\\), and \\(FC = 16\\), compute \\(AD\\).", "Extend \\(DE\\) to meet \\(AC\\) at \\(X\\). Since both triangles are equilateral and \\(D\\) lies inside \\(\\triangle ABC\\), the quadrilaterals \\(ABEX\\) and \\(DFCX\\) are isosceles trapezoids with base angles \\(60^\\circ\\): in \\(\\triangle ABC\\), \\(DE\\) extended cuts \\(AC\\) so that \\(EX \\parallel BC\\)... precisely, \\(\\angle BAE = 60^\\circ = \\angle ABE\\)? The trapezoid argument gives \\[AX = BE = 14,\\qquad DX = FC = 16,\\] and \\(\\angle AXD = 120^\\circ\\). By the law of cosines on \\(\\triangle ADX\\): \\[AD^2 = AX^2 + DX^2 - 2\\cdot AX \\cdot DX \\cos 120^\\circ = 14^2 + 16^2 + 14 \\cdot 16 = 196 + 256 + 224 = 676,\\] so \\[AD = \\sqrt{676} = 26.\\]", "26", ["Extend \\(DE\\) to meet \\(AC\\), producing two isosceles trapezoids with \\(60^\\circ\\) base angles.", "\\(AX = BE = 14\\), \\(DX = FC = 16\\), \\(\\angle AXD = 120^\\circ\\); law of cosines gives \\(AD = \\sqrt{14^2+16^2+14\\cdot16} = 26\\)."], "HMMT Feb 2025 Geo #1", 4.25],
          [56, "Let \\(VENUS\\) be a convex pentagon with area 84. Given that \\(NV \\parallel SU\\), \\(SE \\parallel UN\\), and triangle \\(SUN\\) has area 24, compute the maximum possible area of triangle \\(EUV\\).", "Since \\(SE \\parallel UN\\), triangles \\(SUN\\) and \\(EUN\\) share the base \\(UN\\) and have the same height, so \\[[EUN] = [SUN] = 24.\\] Similarly, \\(NV \\parallel SU\\) implies triangles \\(SUN\\) and \\(SUV\\) share base \\(SU\\) and have equal heights, giving \\[[SUV] = [SUN] = 24.\\] The pentagon \\(VENUS\\) is the union of triangle \\(EUV\\) with the quadrilaterals \\(EUNS\\) and \\(SUVN\\); equivalently, \\[[EUV] = [VENUS] - [EUN] - [SUV] = 84 - 24 - 24 = 36.\\] (No maximization is needed — the area is forced.)", "36", ["Use the parallel lines to move areas: triangles sharing a base between parallels have equal area.", "\\([EUN] = [SUN] = 24\\) and \\([SUV] = [SUN] = 24\\), so \\([EUV] = 84 - 24 - 24 = 36\\)."], "HMMT Nov 2025 Theme #3", 4.50],
          [70, "In a two-dimensional cave with a parallel floor and ceiling, two stalactites of lengths 16 and 36 hang perpendicularly from the ceiling, while two stalagmites of heights 25 and 49 grow perpendicularly from the ground. If the tips of these four structures form the vertices of a square in some order, compute the height of the cave.", "The difference in heights of the two stalactites is \\(36 - 16 = 20\\), while the difference between the stalagmites is \\(49 - 25 = 24\\). If a stalactite tip and a stalagmite tip were adjacent vertices of the square, the vertical distance between them would be the cave height minus both lengths (a fixed value for the two \"diagonal\" pairings) — the unequal differences show the two stalactite tips must be opposite vertices of the square, and likewise the two stalagmite tips. Opposite vertices of a square share a midpoint, so the midpoint of the stalactite tips \\[26\\ \\text{from the ceiling}\\] must coincide with the midpoint of the stalagmite tips \\[37\\ \\text{from the ground}.\\] The cave height is the sum of these two distances: \\[26 + 37 = 63.\\]", "63", ["The tips of the two stalactites are opposite square vertices (their height difference doesn't match the stalagmites'), so the two midpoints coincide.", "Midpoints at \\(\\frac{16+36}{2} = 26\\) from the ceiling and \\(\\frac{25+49}{2} = 37\\) from the ground coincide, so the cave is \\(26+37 = 63\\) tall."], "HMMT Feb 2025 Geo #2", 5.00],
          [53, "Let \\(A, B, C\\), and \\(D\\) be points on a line in that order. There exists a point \\(E\\) such that \\(\\angle AED = 120^\\circ\\) and triangle \\(BEC\\) is equilateral. Given that \\(BC = 10\\) and \\(AD = 39\\), compute \\(|AB - CD|\\).", "Since \\(\\triangle BEC\\) is equilateral, \\(\\angle ABE = 120^\\circ = \\angle AED\\). With \\(\\angle BAE = \\angle EAD\\), we get \\(\\triangle ABE \\sim \\triangle AED\\); similarly \\(\\triangle ECD \\sim \\triangle AED\\). Hence \\(\\triangle ABE \\sim \\triangle ECD\\), so with \\(AB = x\\) and \\(CD = y\\): \\[\\frac{x}{BE} = \\frac{EC}{y}\\ \\Rightarrow\\ \\frac{x}{10} = \\frac{10}{y}\\ \\Rightarrow\\ xy = 100.\\] Also \\(x + y = AB + CD = AD - BC = 39 - 10 = 29\\). Therefore \\[(x-y)^2 = (x+y)^2 - 4xy = 29^2 - 400 = 441,\\] so \\[|AB - CD| = |x - y| = \\sqrt{441} = 21.\\]", "21", ["Find two similar triangles: \\(\\triangle ABE \\sim \\triangle ECD\\) (both are similar to \\(\\triangle AED\\)).", "With \\(AB = x, CD = y\\): \\(\\frac{x}{10} = \\frac{10}{y}\\) so \\(xy = 100\\), and \\(x + y = 29\\); then \\((x-y)^2 = 29^2 - 4\\cdot 100 = 441\\)."], "HMMT Nov 2025 General #5", 5.25],
          [21, "Let ABCD be a trapezoid with \\(AB \\parallel CD\\), \\(AD = 13\\), \\(BC = 15\\), \\(AB = 20\\), and \\(CD = 34\\). Point \\(X\\) lies inside the trapezoid such that \\(\\angle XAB = 2\\angle XBA\\) and \\(\\angle XDC = 2\\angle XCD\\). Compute \\(XD - XA\\).", "Construct \\(P\\) on \\(AB\\) with \\(XA=XP\\), and \\(Q\\) on \\(CD\\) with \\(XD=XQ\\). The angle condition gives \\(QC=XQ=XD\\) and \\(PB=XP=XA\\). Also \\(ADQP\\) is an isosceles trapezoid. Let \\(S\\) be the projection of \\(A\\) onto \\(CD\\), and let \\(T\\) be on \\(CD\\) with \\(AT\\parallel BC\\). Then \\(\\triangle ADT\\) is a \\(13\\)-\\(14\\)-\\(15\\) triangle, so \\(DS=5\\). Hence \\(QD-PA=10\\). Finally, \\[XD-XA=QC-PB=(34-QD)-(20-PA)=14-(QD-PA)=14-10=4.\\] So \\(XD-XA=4\\).", "4", ["Construct \\(P\\) on \\(AB\\) with \\(XA = XP\\) and \\(Q\\) on \\(CD\\) with \\(XD = XQ\\).", "The angle conditions force \\(QC = XQ = XD\\) and \\(PB = XP = XA\\), so \\(ADQP\\) is an isosceles trapezoid; project \\(A\\) onto \\(CD\\) and use the legs 13, 15 and bases 20, 34."], "HMMT Feb 2025 Guts #25", 6.50],
          [71, "Point \\(P\\) lies inside square \\(ABCD\\) such that the areas of \\(\\triangle PAB\\), \\(\\triangle PBC\\), \\(\\triangle PCD\\), and \\(\\triangle PDA\\) are \\(1, 2, 3\\), and \\(4\\), in some order. Compute \\(PA \\cdot PB \\cdot PC \\cdot PD\\).", "Let \\(h_1, h_2, h_3, h_4\\) be the distances from \\(P\\) to sides \\(AB, BC, CD, DA\\). Each triangle area is half the side length times the corresponding height, so the four areas being \\(1,2,3,4\\) means \\(\\{h_1, h_2, h_3, h_4\\} = \\{x, 2x, 3x, 4x\\}\\) for some \\(x\\). The square's area is \\(1+2+3+4 = 10\\), so its side is \\(\\sqrt{10}\\), and \\[h_1 + h_3 = \\sqrt{10} = h_2 + h_4.\\] The only way to pair the four values into two sums of \\(\\sqrt{10}\\) is \\(\\{x, 4x\\}\\) and \\(\\{2x, 3x\\}\\), giving \\(5x = \\sqrt{10}\\), i.e. \\(x = \\frac{2}{\\sqrt{10}}\\) and \\(x^2 = \\frac{2}{5}\\). Now the distances from \\(P\\) to adjacent sides determine \\(PA^2, PB^2, PC^2, PD^2\\) by Pythagoras. The four products of adjacent height pairs are \\((x,2x), (2x,4x), (4x,3x), (3x,x)\\) up to order, so \\[PA\\cdot PB\\cdot PC\\cdot PD = \\sqrt{x^2 + (2x)^2}\\sqrt{(2x)^2 + (4x)^2}\\sqrt{(4x)^2 + (3x)^2}\\sqrt{(3x)^2 + x^2} = \\sqrt{5x^2}\\sqrt{20x^2}\\sqrt{25x^2}\\sqrt{10x^2} = 50\\sqrt{10}\\,x^4 = 50\\sqrt{10}\\left(\\frac25\\right)^2 = 8\\sqrt{10}.\\]", "8√10|8sqrt(10)", ["The four triangle areas give the distances from \\(P\\) to the sides: \\(\\{x,2x,3x,4x\\}\\), and opposite pairs must sum to the square's side.", "\\(\\{h_1,h_3\\} = \\{x,4x\\}\\), \\(\\{h_2,h_4\\} = \\{2x,3x\\}\\), so \\(5x = \\sqrt{10}\\); then the four Pythagorean lengths multiply to \\(50\\sqrt{10}x^4 = 8\\sqrt{10}\\)."], "HMMT Feb 2025 Geo #3", 6.50],
          [72, "A semicircle is inscribed in another semicircle if the smaller semicircle's diameter is a chord of the larger semicircle, and the smaller semicircle's arc is tangent to the diameter of the larger semicircle. Semicircle \\(S_1\\) is inscribed in a semicircle \\(S_2\\), which is inscribed in another semicircle \\(S_3\\). The radii of \\(S_1\\) and \\(S_3\\) are 1 and 10, respectively, and the diameters of \\(S_1\\) and \\(S_3\\) are parallel. The endpoints of the diameter of \\(S_3\\) are \\(A\\) and \\(B\\), and \\(S_2\\)'s arc is tangent to \\(AB\\) at \\(C\\). Compute \\(AC \\cdot CB\\).", "Let \\(P, Q, R\\) be the centers of the arcs of \\(S_3, S_2, S_1\\). Once \\(S_3\\) is fixed, the position of \\(S_2\\) is determined by the angle between the diameters of \\(S_2\\) and \\(S_3\\), and similarly for \\(S_1\\) inside \\(S_2\\). Hence the configurations \\(S_3 \\cup S_2\\) and \\(S_2 \\cup S_1\\) are similar; their radii satisfy \\[\\frac{r_2}{10} = \\frac{1}{r_2}\\ \\Rightarrow\\ r_2^2 = 10,\\] so \\(r_2 = \\sqrt{10}\\). Let \\(V\\) be either intersection of the arcs of \\(S_2\\) and \\(S_3\\). Since \\(V\\) lies on both circles, \\(PV = 10\\), \\(QV = \\sqrt{10}\\), and \\(PQ \\perp\\)? By Pythagoras in \\(\\triangle PVQ\\): \\[PQ = \\sqrt{PV^2 - VQ^2} = \\sqrt{100 - 10} = \\sqrt{90}.\\] Now \\(C\\) is the tangency point of \\(S_2\\)'s arc with \\(AB\\), so \\(QC \\perp AB\\) and \\(C\\) lies on the line through \\(P\\) perpendicular to... the configuration gives \\(PC = \\sqrt{PQ^2 - QC^2} = \\sqrt{90 - 10} = \\sqrt{80}\\). Since \\(A, B\\) are the diameter endpoints of the radius-10 circle centered at \\(P\\): \\[AC \\cdot CB = (10 + PC)(10 - PC) = 100 - PC^2 = 100 - 80 = 20.\\]", "20", ["The nested semicircles are self-similar: \\(r_2/10 = 1/r_2\\), so \\(r_2 = \\sqrt{10}\\).", "With \\(r_2 = \\sqrt{10}\\): \\(PQ = \\sqrt{100-10} = \\sqrt{90}\\), \\(PC = \\sqrt{90-10} = \\sqrt{80}\\), and \\(AC\\cdot CB = 100 - PC^2 = 20\\)."], "HMMT Feb 2025 Geo #4", 7.00],
          [73, "Let \\(\\triangle ABC\\) be an equilateral triangle with side length 6. Let \\(P\\) be a point inside triangle \\(\\triangle ABC\\) such that \\(\\angle BPC = 120^\\circ\\). The circle with diameter \\(AP\\) meets the circumcircle of \\(\\triangle ABC\\) again at \\(X \\ne A\\). Given that \\(AX = 5\\), compute \\(XP\\).", "Let \\(A'\\) be the antipode of \\(A\\) on the circumcircle of \\(\\triangle ABC\\). Since \\(AX\\) is a chord of the circumcircle and \\(\\angle AXA' = 90^\\circ\\) (angle subtending the diameter \\(AA'\\)), the point \\(X\\) lies on the circle with diameter \\(AA'\\); together with \\(X\\) on the circle with diameter \\(AP\\), the points \\(X, P, A'\\) are collinear (both circles pass through \\(X\\) and have their other intersection constrained by the right angle). Since \\(\\angle BPC = 120^\\circ\\) and \\(\\angle BA'C = 180^\\circ - \\angle BAC = 120^\\circ\\), the point \\(P\\) lies on the circle centered at \\(A'\\) through \\(B\\) and \\(C\\). For the equilateral triangle of side 6, the circumradius is \\(6/\\sqrt3 = 2\\sqrt3\\), so \\[A'P = \\frac{BC}{\\sqrt3} = 2\\sqrt3,\\qquad AA' = 2 \\cdot 2\\sqrt3 = 4\\sqrt3.\\] In right triangle \\(\\triangle AXA'\\): \\[XA' = \\sqrt{AA'^2 - AX^2} = \\sqrt{(4\\sqrt3)^2 - 5^2} = \\sqrt{48 - 25} = \\sqrt{23}.\\] Since \\(X, P, A'\\) are collinear with \\(P\\) between \\(X\\) and \\(A'\\): \\[XP = XA' - PA' = \\sqrt{23} - 2\\sqrt3.\\]", "√23-2√3|sqrt(23)-2sqrt(3)", ["Let \\(A'\\) be the antipode of \\(A\\). Then \\(X, P, A'\\) are collinear (\\(\\angle AXA' = \\angle AXP = 90^\\circ\\)).", "\\(P\\) lies on the circle centered at \\(A'\\) through \\(B, C\\), so \\(A'P = 2\\sqrt3\\) and \\(XA' = \\sqrt{(4\\sqrt3)^2 - 5^2} = \\sqrt{23}\\); hence \\(XP = \\sqrt{23} - 2\\sqrt3\\)."], "HMMT Feb 2025 Geo #5", 7.00],
          [2, "Let \\(\\ell\\) and \\(m\\) be two non-coplanar lines in space, and let \\(P_1\\) be a point on \\(\\ell\\). Let \\(P_2\\) be the point on \\(m\\) closest to \\(P_1\\), \\(P_3\\) the point on \\(\\ell\\) closest to \\(P_2\\), \\(P_4\\) the point on \\(m\\) closest to \\(P_3\\), and \\(P_5\\) the point on \\(\\ell\\) closest to \\(P_4\\). Given \\(P_1P_2 = 5\\), \\(P_2P_3 = 3\\), \\(P_3P_4 = 2\\), compute \\(P_4P_5\\).", "Let the answer be \\(a\\), and let \\(h\\) be the distance between the two skew lines. Take the \\(z\\)-axis parallel to the cross product of the two lines' directions, so that \\(\\ell\\) lies in the plane \\(z=0\\) and \\(m\\) lies in the plane \\(z=h\\). Project everything onto the \\(xy\\)-plane. Each \"closest point\" construction preserves the projection ratio: by similar triangles the projected lengths of \\(P_1P_2, P_2P_3, P_3P_4, P_4P_5\\) form a geometric progression. The projected lengths are \\[\\sqrt{25-h^2},\\quad \\sqrt{9-h^2},\\quad \\sqrt{4-h^2},\\quad \\sqrt{a^2-h^2}.\\] Since these form a GP, \\[(9-h^2)^2=(25-h^2)(4-h^2)\\ \\Rightarrow\\ 81-18h^2+h^4=100-29h^2+h^4\\ \\Rightarrow\\ h^2=\\frac{19}{11}.\\] Then \\((4-h^2)^2=(9-h^2)(a^2-h^2)\\), i.e. \\[\\left(\\frac{25}{11}\\right)^2=\\frac{80}{11}\\left(a^2-\\frac{19}{11}\\right) \\ \\Rightarrow\\ \\frac{625}{121}=\\frac{80a^2}{11}-\\frac{1520}{121} \\ \\Rightarrow\\ 880a^2=2145\\ \\Rightarrow\\ a^2=\\frac{39}{16}.\\] Therefore \\(P_4P_5=a=\\frac{\\sqrt{39}}{4}\\).", "\\sqrt{39}/4|sqrt39/4", ["Project everything onto a plane perpendicular to the common perpendicular of the two lines.", "The projected lengths \\(\\sqrt{25-h^2}, \\sqrt{9-h^2}, \\sqrt{4-h^2}, \\sqrt{a^2-h^2}\\) form a geometric progression, so their squares are in GP: the differences \\(16, 5, 4-a^2\\) are in GP."], "HMMT Feb 2024 Guts #23", 7.25],
          [3, "A circle is tangent to both branches of the hyperbola \\(x^2 - 20y^2 = 24\\) as well as the x-axis. Compute the area of this circle.", "Invert about the unit circle centered at the origin. The circle we seek becomes a horizontal line \\(y=k\\) (it does not pass through the origin, since it is tangent to the \\(x\\)-axis away from it). The hyperbola \\(x^2-20y^2=24\\) transforms via \\((X,Y)=\\left(\\frac{x}{x^2+y^2},\\frac{y}{x^2+y^2}\\right)\\) into \\[X^2-20Y^2=24(X^2+Y^2)^2.\\] Tangency of the line \\(Y=k\\) with this curve means the quartic in \\(X\\) has a double root: \\[24X^4+(48k^2-1)X^2+24k^4+20k^2=0.\\] Setting \\(u=X^2\\), the discriminant must vanish: \\[(48k^2-1)^2=4\\cdot 24\\cdot(24k^4+20k^2) \\ \\Rightarrow\\ 1-96k^2=1920k^2\\ \\Rightarrow\\ k^2=\\frac{1}{2016}.\\] The diameter of the circle is the reciprocal of the distance from the origin to the line, so the radius is \\(r=\\frac12\\sqrt{2016}=\\sqrt{504}\\), giving area \\(\\pi r^2=504\\pi\\).", "504\\pi|504pi", ["Invert about the unit circle centered at the origin.", "The circle becomes a horizontal line, and the hyperbola becomes \\(x^2 - 20y^2 = 24(x^2+y^2)^2\\). Tangency forces the line \\(y = \\sqrt{1/2016}\\); the circle's radius is half the reciprocal of the distance from the origin to that line."], "HMMT Feb 2024 Guts #24", 7.50],
          [25, "Points \\(A\\) and \\(B\\) lie on circle \\(\\omega\\) with center \\(O\\). Let \\(X\\) be a point inside \\(\\omega\\) with \\(XO = 2\\sqrt2\\), \\(XA = 1\\), \\(XB = 3\\), and \\(\\angle AXB = 90^\\circ\\). Points \\(Y\\) and \\(Z\\) are on \\(\\omega\\) such that \\(Y \\ne A\\) and triangles \\(\\triangle AXB\\) and \\(\\triangle YXZ\\) are similar with the same orientation. Compute \\(XY\\).", "Consider the rotation about \\(X\\) by \\(90^\\circ\\) followed by a homothety with ratio \\(1/3\\) that sends \\(B\\) to \\(A\\). This sends the circle \\(\\omega\\) to a circle \\(\\omega'\\) of one-third the radius, with center \\(O'\\). Since \\(A\\) is the image of \\(B\\), the point \\(A\\) lies on both circles; the same argument shows \\(Y\\) lies on both circles. Hence \\(Y\\) is the reflection of \\(A\\) across the line \\(OO'\\). In particular \\(XY=AX'\\), where \\(X'\\) is the reflection of \\(X\\) across \\(OO'\\). Let \\(M\\) be the midpoint of \\(AB\\). From \\(\\triangle OXO'\\sim\\triangle BXA\\) we get \\(\\triangle XOX'\\sim\\triangle XMA\\), hence \\(\\triangle XOM\\sim\\triangle XX'A\\), so \\[AX'=OM\\cdot\\frac{XA}{XM}=\\frac{\\sqrt{10}}{5}\\,OM.\\] To find \\(OM\\): the distance from \\(O\\) to the foot of \\(X\\) on \\(AB\\) is \\(\\frac{2}{5}\\sqrt{10}\\), and the altitude of \\(\\triangle AXY\\) has length \\(\\frac{3}{10}\\sqrt{10}\\); the Pythagorean theorem gives \\[OM=\\frac{3}{10}\\sqrt{10}+\\sqrt{(2\\sqrt2)^2-\\left(\\frac{2}{5}\\sqrt{10}\\right)^2} =\\frac{11}{10}\\sqrt{10}.\\] Therefore \\[XY=AX'=\\frac{\\sqrt{10}}{5}\\cdot\\frac{11}{10}\\sqrt{10}=\\frac{11}{5}.\\]", "11/5", ["A rotation about \\(X\\) by \\(90^\\circ\\) followed by a homothety of ratio \\(1/3\\) sends \\(B\\) to \\(A\\).", "It sends \\(\\omega\\) to a circle \\(\\omega'\\) of radius \\(R/3\\). Find where \\(\\omega\\) and \\(\\omega'\\) meet, using \\(XO = 2\\sqrt2, XA = 1, XB = 3\\)."], "HMMT Feb 2025 Guts #29", 7.50],
          [28, "Let ABC be an acute scalene triangle with circumcenter \\(O\\) and centroid \\(G\\). Given that \\(\\triangle AGO\\) is right, \\(AO = 9\\), and \\(BC = 15\\), let \\(S\\) be the sum of all possible values for the area of \\(\\triangle AGO\\). Compute \\(S^2\\).", "For any triangle, \\(O,H,G\\) are collinear with \\(HG=2OG\\). Let \\(OG=x\\), so \\(HG=2x\\). From \\(\\sin A=\\frac{BC}{2R}=\\frac{15}{18}=\\frac56\\), we get \\(\\cos A=\\frac{\\sqrt{11}}{6}\\). Case 1: \\(AG\\perp OG\\). Then \\[x^2+AG^2=AO^2=81,\\qquad 4x^2+AG^2=AH^2=(2R\\cos A)^2=2^2\\cdot 9^2\\cdot\\frac{11}{36}=99.\\] Subtracting gives \\(3x^2=18\\), so \\(x=\\sqrt6\\) and \\(AG=5\\sqrt3\\). Area: \\(\\frac12\\sqrt6\\cdot 5\\sqrt3=\\frac{15\\sqrt2}{2}\\). Case 2: \\(AO\\perp OG\\). Then \\(99=AH^2=AO^2+OH^2=81+9x^2\\), so \\(x^2=2\\). Area: \\(\\frac12\\cdot \\sqrt2\\cdot 9=\\frac{9\\sqrt2}{2}\\). Sum of the two possible areas: \\[S=\\frac{15\\sqrt2}{2}+\\frac{9\\sqrt2}{2}=12\\sqrt2,\\] so \\(S^2=(12\\sqrt2)^2=288\\).", "288", ["\\(O, H, G\\) are collinear with \\(HG = 2OG\\), and \\(\\sin A = \\frac{BC}{2R}\\).", "\\(\\sin A = \\frac{15}{18} = \\frac56\\), so \\(\\cos A = \\frac{\\sqrt{11}}{6}\\). Casework on which angle of \\(\\triangle AGO\\) is right gives two areas summing to \\(12\\sqrt2\\)."], "HMMT Feb 2022 Guts #25", 7.50],
          [36, "Let \\(E\\) be a three-dimensional ellipsoid. For a plane \\(p\\), let \\(E(p)\\) be the projection of \\(E\\) onto \\(p\\). The minimum and maximum areas of \\(E(p)\\) are \\(9\\pi\\) and \\(25\\pi\\), and there exists a \\(p\\) where \\(E(p)\\) is a circle of area \\(16\\pi\\). If \\(V\\) is the volume of \\(E\\), compute \\(V/\\pi\\).", "Let the three radii of the ellipsoid be \\(a<b<c\\). The minimum and maximum projection areas are \\(\\pi ac\\)? Rather, the principal projection areas are \\(\\pi bc,\\pi ac,\\pi ab\\), so \\(ab=9\\) and \\(bc=25\\) (the extremes). Consider a plane \\(p\\) where the projection has area \\(9\\pi\\); rotate the ellipsoid about the axis of length \\(b\\). The projection onto the fixed plane becomes an ellipse with radii \\(b\\) and \\(r\\), where \\(r\\) increases continuously from \\(a\\) to \\(c\\). By the intermediate value theorem, at some rotation the projection is a circle with radius \\(b\\), whose area is \\(\\pi b^2=16\\pi\\). Hence \\(b=4\\), and \\(abc=(ab)(bc)/b=9\\cdot 25/4=225/4\\). The volume of the ellipsoid is \\[V=\\frac43\\pi abc=\\frac43\\pi\\cdot\\frac{225}{4}=75\\pi,\\] so \\(V/\\pi=75\\).", "75", ["For semi-axes \\(a \\le b \\le c\\), projection areas range from \\(\\pi ab\\) to \\(\\pi bc\\).", "So \\(ab = 9\\) and \\(bc = 25\\). A circular projection must have radius \\(b\\): \\(\\pi b^2 = 16\\pi\\), giving \\(b=4, a=\\frac94, c=\\frac{25}{4}\\)."], "HMMT Feb 2021 Guts #22", 7.75],
          [43, "Let ABCD be a cyclic quadrilateral with diagonals \\(AC\\) and \\(BD\\) meeting at \\(E\\). Let \\(W\\) and \\(Y\\) be the feet of the altitudes from \\(E\\) to sides \\(DA\\) and \\(BC\\), and let \\(X\\) and \\(Z\\) be the midpoints of \\(AB\\) and \\(CD\\). Given that the area of \\(\\triangle AED\\) is 9, the area of \\(\\triangle BEC\\) is 25, and \\(\\angle EBC - \\angle ECB = 30^\\circ\\), compute the area of quadrilateral \\(WXYZ\\).", "Reflect \\(E\\) across \\(DA\\) to \\(E_W\\), and across \\(BC\\) to \\(E_Y\\). Since \\(ABCD\\) is cyclic, \\(\\triangle AED\\sim\\triangle BEC\\) with similarity ratio \\(3:5\\) (areas \\(9:25\\)); hence \\(\\triangle E_WAE_D\\sim\\triangle E_YBE_C\\) as well. Now \\(W\\) is the midpoint of \\(E_WE\\), \\(X\\) of \\(AB\\), \\(Y\\) of \\(EE_Y\\), and \\(Z\\) of \\(DC\\), so \\(WXYZ\\) is similar to these triangles. From the given data, \\(E_WE:E_YE=3:5\\) and \\(\\angle WE_WE_Y=150^\\circ\\). Writing \\(E_WE=3x,\\ E_YE=5x\\), the law of cosines gives \\[WY=\\sqrt{(3x)^2+(5x)^2-2(3x)(5x)\\cos 150^\\circ} =\\sqrt{34+15\\sqrt3}\\,x.\\] The similarity ratio of \\(WXYZ\\) to \\(\\triangle E_WAE_D\\) is \\(\\frac{WY}{E_WE}=\\frac{\\sqrt{34+15\\sqrt3}}{6}\\). The area of \\(\\triangle E_WAE_D\\) is twice the area of \\(\\triangle AED\\), i.e. \\(2\\cdot 9=18\\). Therefore \\[[WXYZ]=18\\cdot\\left(\\frac{\\sqrt{34+15\\sqrt3}}{6}\\right)^2 =18\\cdot\\frac{34+15\\sqrt3}{36} =\\frac{34+15\\sqrt3}{2} =17+\\frac{15\\sqrt3}{2}.\\]", "17+15\\sqrt{3}/2|17+15sqrt3/2", ["Use coordinates centered at \\(E\\) with the diagonals as axes.", "Areas 9 and 25 give \\(AE\\cdot DE = 18\\) and \\(BE\\cdot CE = 50\\). The midpoint/altitude construction makes \\(WXYZ\\) a rectangle whose sides involve the \\(30^\\circ\\) condition."], "HMMT Feb 2020 Guts #26", 7.75],
          [13, "Let \\(PABC\\) be a tetrahedron with \\(\\angle APB = \\angle APC = \\angle BPC = 90^\\circ\\), \\(\\angle ABC = 30^\\circ\\), and \\(AP^2\\) equal to the area of triangle ABC. Compute \\(\\tan \\angle ACB\\).", "First compute the tangents of two angles of \\(\\triangle ABC\\). From \\[[ABC]=\\frac12 AB\\cdot AC\\sin\\angle BAC=AP^2=\\frac12(AB^2+AC^2-BC^2),\\] and \\(AP^2=AB\\cdot AC\\cos\\angle BAC\\), we get \\[\\frac12 AB\\cdot AC\\sin A=AB\\cdot AC\\cos A,\\] so \\(\\tan A=2\\). Also \\(\\tan B=\\frac{1}{\\sqrt{3}}\\). For any angles \\(\\alpha+\\beta+\\gamma=\\pi\\), \\[\\tan\\alpha+\\tan\\beta+\\tan\\gamma=\\tan\\alpha\\tan\\beta\\tan\\gamma.\\] Thus \\[\\tan C+2+\\frac{1}{\\sqrt{3}}=\\tan C\\cdot 2\\cdot\\frac{1}{\\sqrt{3}},\\] and solving gives \\[\\tan C\\left(\\frac{2}{\\sqrt{3}}-1\\right)=2+\\frac{1}{\\sqrt{3}} \\ \\Rightarrow\\ \\tan C=\\frac{2+\\frac{1}{\\sqrt{3}}}{\\frac{2}{\\sqrt{3}}-1}=8+5\\sqrt{3}.\\] So \\(\\tan\\angle ACB=8+5\\sqrt{3}\\).", "8+5\\sqrt{3}|8+5sqrt3", ["Use \\([ABC] = AP^2\\) together with the right angles at \\(P\\).", "Derive \\(\\tan\\angle BAC = 2\\) and \\(\\tan\\angle ABC = \\frac{1}{\\sqrt3}\\); for angles summing to \\(180^\\circ\\), \\(\\tan A+\\tan B+\\tan C = \\tan A\\tan B\\tan C\\)."], "HMMT Feb 2023 Guts #26", 8.00],
          [30, "In three-dimensional space, let \\(S\\) be the region of points \\((x,y,z)\\) satisfying \\(-1 \\le z \\le 1\\). Let \\(S_1, \\ldots, S_{2022}\\) be 2022 independent random rotations of \\(S\\) about the origin. The expected volume of \\(S_1 \\cap \\cdots \\cap S_{2022}\\) can be expressed as \\(\\frac{a\\pi}{b}\\) for relatively prime positive integers \\(a, b\\). Compute \\(100a + b\\).", "For a point at distance \\(r\\) from the origin, its projection onto the axis of a random rotation of the slab \\(S\\) is uniform in \\([-r,r]\\); the point lies in the slab iff this projection has absolute value at most 1. So for \\(r\\le 1\\) the point is always inside every \\(S_i\\), while for \\(r>1\\) the probability it lies in one random rotation is \\(1/r\\), and in all 2022 independent rotations it is \\(r^{-2022}\\). The expected volume is therefore \\[V=\\frac{4\\pi}{3}+\\int_{1}^{\\infty}4\\pi r^2\\cdot r^{-2022}\\,dr =\\frac{4\\pi}{3}+4\\pi\\int_1^\\infty r^{-2020}\\,dr =\\frac{4\\pi}{3}+\\frac{4\\pi}{2019} =\\frac{4\\pi(2019+3)}{3\\cdot 2019} =\\frac{2696\\pi}{2019}.\\] Thus \\(a=2696\\), \\(b=2019\\), and \\(100a+b=269600+2019=271619\\).", "271619", ["A point at distance \\(r\\) from the origin lies in a random rotation of \\(S\\) with probability \\(1 - \\frac{2}{\\pi}\\arcsin\\left(\\min\\left(1, \\frac1r\\right)\\right)\\).", "Integrate this probability to the 2022nd power over all of space; the expected volume comes out to \\(\\frac{2716\\pi}{19}\\)."], "HMMT Feb 2022 Guts #27", 8.00],
          [44, "Let \\(\\triangle ABC\\) be inscribed in a unit circle with center \\(O\\). Let \\(I\\) be the incenter, and let \\(D\\) be the intersection of \\(BC\\) and the angle bisector of \\(\\angle BAC\\). Suppose the circumcircle of \\(\\triangle ADO\\) meets \\(BC\\) again at a point \\(E\\) lying on \\(IO\\). If \\(\\cos A = \\frac{12}{13}\\), find the area of \\(\\triangle ABC\\).", "Lemma: \\(AD\\perp EO\\). Proof: by the shooting lemma, the reflection \\(M'\\) of the midpoint \\(M\\) of arc \\(BC\\) (not containing \\(A\\)) over \\(BC\\) lies on circle \\((ADO)\\). Hence \\[\\angle ADE+\\angle DEO=\\angle MDC+\\angle DM'O=\\angle MDC+\\angle M'MD=90^\\circ,\\] which forces \\(AD\\perp EO\\). Therefore \\(I\\) (the incenter) is the foot from \\(O\\) onto \\(AD\\), so \\[AI^2+IO^2=AO^2.\\] By Euler's formula, \\(OI^2=R^2-2Rr\\), and \\(AI=\\frac{r}{\\sin(A/2)}\\). With \\(R=1\\): \\[\\left(\\frac{r}{\\sin(A/2)}\\right)^2+1-2r=1 \\ \\Rightarrow\\ r=2R\\sin^2\\frac A2.\\] Then the semiperimeter is \\(s=a+r\\cot\\frac A2=a+R\\sin A=3R\\sin A\\), where \\(a=BC=2R\\sin A\\). Hence \\[[ABC]=rs=\\left(2R\\sin^2\\frac A2\\right)(3R\\sin A)=3R^2(1-\\cos A)\\sin A.\\] With \\(R=1\\), \\(\\sin A=\\frac{5}{13}\\), \\(\\cos A=\\frac{12}{13}\\): \\[[ABC]=3\\cdot\\frac{1}{13}\\cdot\\frac{5}{13}=\\frac{15}{169}.\\]", "15/169", ["\\(\\cos A = \\frac{12}{13}\\) gives \\(\\sin A = \\frac{5}{13}\\); combine the angle-bisector theorem with the condition that \\(E\\) lies on \\(IO\\).", "Use power of a point on the unit circle; the forced configuration gives area \\(\\frac{15}{169}\\)."], "HMMT Feb 2020 Guts #28", 8.00],
          [27, "There exists a unique circle tangent to the parabola \\(y = x^2\\) at two points and tangent to the curve \\(x = \\sqrt{\\frac{y^3}{1-y}}\\). Compute the radius of this circle.", "Squaring the second curve gives \\(x^2=\\frac{y^3}{1-y}\\), which rearranges to \\[\\frac{x^2}{(x^2+y^2)^2}=\\frac{y}{x^2+y^2}.\\] This is exactly the statement that the curves \\(y=x^2\\) and \\(x^2=\\frac{y^3}{1-y}\\) are images of each other under inversion about the unit circle \\(x^2+y^2=1\\). Since the circle we seek is tangent to both, it must be invariant under this inversion. A circle invariant under inversion about the unit circle (and not passing through the origin) has its center on the \\(y\\)-axis, so write it as \\[x^2+(y-y_0)^2=r^2.\\] Invariance means the circle is orthogonal to the unit circle, so the tangent length from the origin is 1: \\[y_0^2-r^2=1.\\] Tangency to \\(y=x^2\\): minimizing the distance from \\((0,y_0)\\) to the parabola gives the tangency condition \\(r^2=y_0-\\frac14\\). (The stationary point \\(t=0\\) yields the larger value \\(y_0^2\\).) Combining: \\[y_0^2-r^2=1\\ \\text{and}\\ r^2=y_0-\\frac14 \\ \\Rightarrow\\ y_0^2-y_0+\\frac14=1 \\ \\Rightarrow\\ y_0=\\frac32,\\quad r^2=\\frac54.\\] So the radius is \\(r=\\frac{\\sqrt5}{2}\\).", "\\sqrt{5}/2|sqrt5/2", ["Square the second curve: \\(x^2 = \\frac{y^3}{1-y}\\), which rearranges to \\(\\frac{x^2}{(x^2+y^2)^2} = \\frac{y}{x^2+y^2}\\).", "Both curves swap under inversion about the unit circle. The unique circle tangent to both maps to a line tangent to both; solving gives radius \\(\\frac{\\sqrt5}{2}\\)."], "HMMT Feb 2025 Guts #31", 8.25],
          [32, "Let \\(a \\ne b\\) be positive real numbers and \\(m, n\\) positive integers. An \\((m+n)\\)-gon \\(P\\) has \\(m\\) sides of length \\(a\\) and \\(n\\) sides of length \\(b\\), and can be inscribed in a circle of radius \\(a+b\\). Compute the number of ordered pairs \\((m,n)\\) with \\(m, n \\le 100\\) for which such a polygon exists for some distinct \\(a, b\\).", "Set \\(x=\\frac{a}{a+b}\\in(0,1)\\). A polygon with \\(m\\) sides of length \\(a\\) and \\(n\\) sides of length \\(b\\) inscribed in a circle of radius \\(a+b\\) exists iff \\[m\\arcsin\\frac{x}{2}+n\\arcsin\\frac{1-x}{2}=\\pi.\\] The left side is convex in \\(x\\), so a solution exists exactly when it exceeds \\(\\pi\\) at some endpoint. Hence \\(\\max(m,n)\\ge 7\\). If \\(\\min(m,n)\\le 5\\), the intermediate value theorem gives a solution. If \\(\\min(m,n)\\ge 7\\), then \\[m\\arcsin\\frac{x}{2}+n\\arcsin\\frac{1-x}{2}\\ge 14\\arcsin\\frac14>\\pi\\] (using \\(\\arcsin(1/4)>\\pi/14\\)). Finally, \\(\\min(m,n)=6\\) never works: with \\(n=6\\) the derivative at \\(0\\) is \\[\\frac{m}{2}-6\\cdot\\frac{1}{\\sqrt{3}}=\\frac{m-\\sqrt{48}}{2}>0,\\] so the sum starts above \\(\\pi\\) and stays convex — no crossing. Thus we need \\(\\min(m,n)\\le 5\\) and \\(\\max(m,n)\\ge 7\\), with \\(m,n\\le 100\\). Count ordered pairs: the smaller of \\(m,n\\) is in \\(\\{1,\\ldots,5\\}\\) and the larger in \\(\\{7,\\ldots,100\\}\\) (94 choices). The count is \\[2\\cdot 5\\cdot 94=940.\\]", "940", ["Set \\(x = \\frac{a}{a+b}\\). Each side of length \\(a\\) subtends central angle \\(2\\arcsin(x/2)\\).", "We need \\(m\\arcsin(x/2) + n\\arcsin((1-x)/2) = \\pi\\). The LHS is convex in \\(x\\), so \\(\\max(m,n) \\ge 7\\), and \\(\\min(m,n) = 6\\) is the only failing case."], "HMMT Feb 2022 Guts #29", 8.50],
          [45, "Let ABCD be a tetrahedron whose circumscribed sphere of radius \\(R\\) and inscribed sphere of radius \\(r\\) are concentric. Given \\(AB = AC = 1 \\le BC\\) and \\(R = 4r\\), find \\(BC^2\\).", "Since the circumsphere and insphere are concentric, the tetrahedron is isosceles: \\(AB=CD,\\ AC=BD,\\ AD=BC\\). (Projecting the common center \\(O\\) onto each face breaks it into congruent isosceles triangles, and unfolding the net shows each face is partitioned identically.) Let \\(P\\) be the projection of \\(O\\) onto face \\(ABC\\), and set \\(x=BC\\). The distance from \\(P\\) to each of \\(A,B,C\\) is \\[PA=\\sqrt{R^2-r^2}=r\\sqrt{15}\\] (using \\(R=4r\\)). By the circumradius-area formula for \\(\\triangle ABC\\) (whose circumradius is \\(PA\\)): \\[[ABC]=\\frac{AB\\cdot AC\\cdot BC}{4\\cdot PA}=\\frac{x}{4r\\sqrt{15}}.\\] On the other hand, decomposing the tetrahedron into the four tetrahedra \\(OABC, OABD, OACD, OBCD\\), each of height \\(r\\): \\[[ABC]=\\frac{3V}{4r},\\] where \\(V=[ABCD]\\). Equating the two expressions gives \\(V=\\frac{x}{3\\sqrt{15}}\\). The volume of an isosceles tetrahedron with opposite edge pairs \\((x,x),(1,1),(1,1)\\) is given by \\[V^2=\\frac{1}{72}(2-x^2)\\cdot x^2\\cdot x^2 \\ \\Rightarrow\\ V=\\frac{x^2}{6\\sqrt2}\\sqrt{2-x^2}=x^2\\sqrt{\\frac{2-x^2}{72}}.\\] Substituting \\(V=\\frac{x}{3\\sqrt{15}}\\): \\[\\frac{x}{3\\sqrt{15}}=x^2\\sqrt{\\frac{2-x^2}{72}} \\ \\Rightarrow\\ \\frac{1}{135}=\\frac{x^2(2-x^2)}{72} \\ \\Rightarrow\\ 15x^2(2-x^2)=8.\\] Letting \\(u=x^2\\): \\(15u^2-30u+8=0\\), so \\[u=\\frac{30\\pm\\sqrt{900-480}}{30}=1\\pm\\frac{\\sqrt{105}}{15}.\\] Taking the solution \\(\\ge 1\\): \\[BC^2=x^2=1+\\frac{\\sqrt{105}}{15}=1+\\sqrt{\\frac{7}{15}}.\\]", "1+\\sqrt{105}/15|1+sqrt105/15|1+\\sqrt{7/15}|1+sqrt(7/15)", ["Concentric circum- and in-spheres force the tetrahedron to be isosceles: \\(AB=CD, AC=BD, AD=BC\\).", "Let \\(x=BC\\). The projection \\(P\\) of the center onto face ABC satisfies \\(PA = \\sqrt{R^2-r^2} = r\\sqrt{15}\\), so \\([ABC] = \\frac{x}{4r\\sqrt{15}} = \\frac{3V}{4r}\\), and \\(V = x^2\\sqrt{\\frac{2-x^2}{72}}\\). Solve \\(x = 3\\sqrt{15}\\,V\\)."], "HMMT Feb 2020 Guts #29", 8.75],

  { id: "level5", name: "Rising Star", desc: "Reach level 5", icon: "\u2729", test: () => levelInfo(mot.xp).level >= 5 },

];
const DEFAULT_MOT = { xp: 0, lastSolvedDay: "", streak: 0, bestStreak: 0, bestDay: 0, todaySolved: 0, totalSolved: 0, goal: 5, badges: [], byDay: {} };
let mot = Object.assign({}, DEFAULT_MOT, JSON.parse(localStorage.getItem("mmot") || "{}"));

function dayStr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function todayStr() { return dayStr(new Date()); }
function levelInfo(xp) {
  let level = 1, rem = xp;
  while (rem >= 100 * level) { rem -= 100 * level; level++; }
  return { level: level, cur: rem, next: 100 * level };
}
function xpFor(levelIndex) { return 10 + 5 * levelIndex; }
function saveMot() { localStorage.setItem("mmot", JSON.stringify(mot)); }
function refreshDay() {
  const t = todayStr();
  if (mot.lastSolvedDay && mot.lastSolvedDay !== t) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    if (mot.lastSolvedDay !== dayStr(y)) mot.streak = 0;
  }
  if (mot.lastSolvedDay !== t) mot.todaySolved = 0;
}
function recordSolve() {
  const t = todayStr();
  if (mot.lastSolvedDay !== t) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    mot.streak = (mot.lastSolvedDay === dayStr(y)) ? mot.streak + 1 : 1;
    mot.lastSolvedDay = t;
    mot.todaySolved = 0;
  }
  mot.todaySolved++;
  mot.totalSolved++;
  mot.byDay[t] = (mot.byDay[t] || 0) + 1;
  if (mot.streak > mot.bestStreak) mot.bestStreak = mot.streak;
  if (mot.todaySolved > mot.bestDay) mot.bestDay = mot.todaySolved;
  saveMot();
}
function awardCorrect(sid, pid, sec) {
  const before = levelInfo(mot.xp);
  const li = sec.levels.findIndex(l => l.probs.some(p => p[0] === pid));
  const gain = xpFor(li);
  recordSolve();
  mot.xp += gain;
  saveMot();
  const after = levelInfo(mot.xp);
  if (after.level > before.level) {
    burstConfetti();
    toast("Level " + after.level + " reached!", "level");
  } else {
    toast("+" + gain + " XP", "xp");
  }
  maybeBadges(true);
}
function maybeBadges(announce) {
  const earned = BADGES.filter(b => mot.badges.indexOf(b.id) === -1 && b.test());
  if (earned.length) {
    earned.forEach(b => mot.badges.push(b.id));
    saveMot();
    if (announce) {
      burstConfetti();
      earned.forEach(b => toast("Badge unlocked: " + b.name, "badge"));
    }
  }
  return earned;
}

// UI: toasts, confetti, badge modal, motivation bar
function ensureShell() {
  if (!document.getElementById("toast-wrap")) { const w = document.createElement("div"); w.id = "toast-wrap"; document.body.appendChild(w); }
  if (!document.getElementById("badge-modal")) { const m = document.createElement("div"); m.id = "badge-modal"; document.body.appendChild(m); }
}
function toast(msg, kind) {
  ensureShell();
  const t = document.createElement("div");
  t.className = "toast " + (kind || "");
  t.textContent = msg;
  document.getElementById("toast-wrap").appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 320); }, 2200);
}
function burstConfetti() {
  let cv = document.getElementById("confetti-canvas");
  if (!cv) { cv = document.createElement("canvas"); cv.id = "confetti-canvas"; document.body.appendChild(cv); }
  const ctx = cv.getContext("2d");
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const colors = ["#4361ee", "#2d9f5e", "#f9a825", "#e74c3c", "#8e44ad", "#16a085"];
  const parts = [];
  for (let i = 0; i < 140; i++) {
    parts.push({
      x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.5,
      vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
      c: colors[i % colors.length]
    });
  }
  let frame = 0;
  function step() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (frame < 160 && parts.some(p => p.y < cv.height + 40)) requestAnimationFrame(step);
    else { ctx.clearRect(0, 0, cv.width, cv.height); cv.remove(); }
  }
  step();
}

const API_BASE = location.hostname === 'hub.laxmiang.work.gd' ? '/math' : 'https://hub.laxmiang.work.gd/math';

// Try to load progress from server
async function syncLoad() {
  try {
    const r = await fetch(API_BASE + '/api/load', { signal: AbortSignal.timeout(5000) });
    if (!r.ok) return;
    const data = await r.json();
    if (data.sols) { sols = Object.assign({}, data.sols, sols); localStorage.setItem("msol", JSON.stringify(sols)); }
    if (data.checkStates) { checkStates = Object.assign({}, data.checkStates, checkStates); localStorage.setItem("mcheck", JSON.stringify(checkStates)); }
    if (data.userSolutions) { userSolutions = Object.assign({}, data.userSolutions, userSolutions); localStorage.setItem("msolutions", JSON.stringify(userSolutions)); }
    if (data.mot) {
      const srv = Object.assign({}, DEFAULT_MOT, data.mot);
      const loc = Object.assign({}, DEFAULT_MOT, mot);
      const numKeys = ['xp','streak','bestStreak','bestDay','todaySolved','totalSolved'];
      for (const k of numKeys) loc[k] = Math.max(loc[k] || 0, srv[k] || 0);
      loc.byDay = Object.assign({}, srv.byDay, loc.byDay);
      mot = loc;
      localStorage.setItem("mmot", JSON.stringify(mot));
    }
    refreshDay();
    maybeBadges(false);
    render();
    syncSave(); // push merged union back so both origins stay in sync
  } catch(e) { /* server not available, use local */ }
}

// Save progress to server
function syncSave() {
  const data = JSON.stringify({ sols, checkStates, userSolutions, mot });
  fetch(API_BASE + '/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: data, signal: AbortSignal.timeout(5000) }).catch(() => {});
}

function key(s, p) { return s + "-" + p; }
function done(s, p) { return !!sols[key(s, p)]; }

function toggle(s, p) {
  const k = key(s, p);
  sols[k] = !sols[k];
  localStorage.setItem("msol", JSON.stringify(sols));
  if (sols[k]) maybeBadges(true);
  syncSave();
  render();
}

function checkAns(sid, pid, ansStr) {
  const k = key(sid, pid);
  const sec = SECTIONS.find(s => s.id === sid);
  for (const l of sec.levels) {
    for (const p of l.probs) {
      if (p[0] === pid) {
        const correct = matchAns(ansStr, p[3]);
        checkStates[k] = correct ? "correct" : "wrong";
        if (correct) {
          const first = !sols[k];
          sols[k] = true;
          localStorage.setItem("msol", JSON.stringify(sols));
          if (first) awardCorrect(sid, pid, sec);
        }
        localStorage.setItem("mcheck", JSON.stringify(checkStates));
        syncSave();
render();
        return;
      }
    }
  }
}

function renderPrac(main, sec) {
  let t = 0, d = 0;
  sec.levels.forEach(l => l.probs.forEach(p => { t++; if (done(sec.id, p[0])) d++; }));

  html += '<div class="progress"><div class="progress-fill" style="width:' + (t ? (d/t*100) : 0) + '%"></div></div>';
  html += '<div class="filter-bar">';
  [["all", "All"], ["solved", "Solved"], ["unsolved", "Unsolved"]].forEach(pair => {
    const k = pair[0], label = pair[1];
    const n = k === "all" ? t : k === "solved" ? d : t - d;
    html += '<button class="filter-pill' + (filt === k ? ' active' : '') + '" onclick="setSecFilter(\'' + sec.id + '\',\'' + k + '\')">' + label + ' ' + n + '</button>';
  });
  html += '</div>';
  sec.levels.forEach(l => {
    const lk = sec.id + '|' + l.n;
    const collapsed = sec.collapsible && !!lvlCollapsed[lk];
    const lprobs = filt === "all" ? l.probs : l.probs.filter(p => filt === "solved" ? done(sec.id, p[0]) : !done(sec.id, p[0]));
    const ld = lprobs.filter(p => done(sec.id, p[0])).length;

    if (sec.collapsible) {

    }

      const sid = sec.id, pid = p[0], solved = done(sid, pid), open = !!openSols[key(sid, pid)];

      html += '<button class="btn btn-primary" onclick="checkAns(\'' + sid + '\',' + pid + ',document.getElementById(\'input-' + key(sid, pid) + '\').value)">Check</button>';
      html += '<span class="enter-hint">press &#8629; Enter</span>';

        html += '</div></div>';

function renderLesson(main, sec) {
  let html = '<h2>' + sec.title + '</h2><p class="subtitle">' + sec.sub + '</p>';
  sec.sections.forEach(s => {
    html += '<div class="lesson"><h3>' + R(s.h) + '</h3>';
    s.c.forEach(item => {
      if (item.t === "p") html += '<p>' + R(item.v) + '</p>';
      else if (item.t === "d") html += K.renderToString(item.v, Object.assign({}, opts, { displayMode: true }));
      else if (item.t === "h4") html += '<h4>' + R(item.v) + '</h4>';
      else if (item.t === "ex") html += '<div class="ex"><div class="ex-title">' + item.title + '</div>' + R(item.v) + '</div>';
      else if (item.t === "table") {
        html += '<table><thead><tr>';
        item.headers.forEach(h => html += '<th>' + h + '</th>');
        html += '</tr></thead><tbody>';
        item.rows.forEach(r => { html += '<tr>'; r.forEach(c => html += '<td>' + R(c) + '</td>'); html += '</tr>'; });
        html += '</tbody></table>';
      }
      else if (item.t === "ul") { html += '<ul>'; item.v.forEach(x => html += '<li>' + R(x) + '</li>'); html += '</ul>'; }
    });
    html += '</div>';
  });
  main.innerHTML = html;
}

function topicSolved(sets) {
  let solved = 0, total = 0;
  for (const sid of sets || []) {
    const sec = SECTIONS.find(x => x.id === sid);
    if (!sec || sec.type !== "prac") continue;
    for (const l of sec.levels || []) {
      for (const p of l.probs || []) {
        if (!p) continue;
        total++;
        if (sols[key(sid, p[0])]) solved++;
      }
    }
  }
  return { solved, total };
}

// Derive roadmap status from real solve progress. Items the user has manually
// toggled (item.override) keep their manual status; everything else reflects
// the actual solved/total across the topic's linked practice sets.
function deriveTopicProgress() {
  SECTIONS.filter(s => s.type === "topics").forEach(sec => {
    sec.topics.forEach(cat => cat.items.forEach(item => {
      const st = topicSolved(item.sets);
      item._solved = st.solved; item._total = st.total;
      if (item.override) return;
      item.status = st.total > 0 && st.solved >= st.total ? "done"
                  : st.solved > 0 ? "progress" : "todo";
    }));
  });
}

function renderTopics(main, sec) {
  deriveTopicProgress();
  let total = 0, doneCount = 0;
  sec.topics.forEach(cat => cat.items.forEach(item => {
    total++;
    if (item.status === "done") doneCount++;
  }));
  let html = '<h2>' + sec.title + '</h2><p class="subtitle">' + sec.sub + '</p>';
  html += '<div class="topic-progress"><div class="topic-progress-bar"><div class="topic-progress-fill" style="width:' + (total ? (doneCount/total*100) : 0) + '%"></div></div>';
  html += '<div class="topic-summary">' + doneCount + ' / ' + total + ' topics completed (' + Math.round(doneCount/total*100) + '%) — status follows your solved problems</div></div>';
  sec.topics.forEach(cat => {
    html += '<div class="topic-cat">' + cat.cat + '</div>';
    cat.items.forEach((item, i) => {
      const isDone = item.status === "done";
      const pct = item._total ? Math.round(item._solved / item._total * 100) : 0;
      html += '<div class="topic-item">';
      html += '<div class="topic-check' + (isDone ? ' done' : '') + '" onclick="toggleTopic(\'' + sec.id + '\',' + sec.topics.indexOf(cat) + ',' + i + ')" title="' + (item.override ? 'Manual status — click to change' : 'Auto from solves — click to override') + '">' + (isDone ? '&#10003;' : '') + '</div>';
      html += '<div class="topic-body"><div class="topic-name' + (isDone ? ' done' : '') + '">' + item.name + '</div>';
      html += '<div class="topic-notes">' + item.notes + '</div>';
      if (item.sets && item.sets.length) html += '<a class="topic-link" onclick="go(\'' + item.sets[0] + '\')">Practice \u2192</a>';
      if (item._total > 0) {
        html += '<div class="topic-minibar"><div class="topic-minibar-fill" style="width:' + pct + '%"></div></div>';
        html += '<div class="topic-num">' + item._solved + '/' + item._total + ' solved' + (item.override ? ' (manual)' : '') + '</div>';
      }
      html += '</div></div>';
    });
  });
  main.innerHTML = html;
}

function toggleTopic(secId, catIdx, itemIdx) {
  const sec = SECTIONS.find(s => s.id === secId);
  const item = sec.topics[catIdx].items[itemIdx];
  // Manual override: flips the EFFECTIVE status; stored so derived progress
  // doesn't fight the user's own assessment.
  const cur = item.status === "done" ? "todo" : "done";
  item.status = cur;
  item.override = true;
  localStorage.setItem("mtopics", JSON.stringify(getTopicStates()));
  render();
}

function getTopicStates() {
  const states = {};
  SECTIONS.filter(s => s.type === "topics").forEach(sec => {
    states[sec.id] = sec.topics.map(cat => cat.items.map(item => item.status));
  });
  return states;
}

function loadTopicStates() {
  const saved = JSON.parse(localStorage.getItem("mtopics") || "{}");
  SECTIONS.filter(s => s.type === "topics").forEach(sec => {
    if (saved[sec.id]) {
      sec.topics.forEach((cat, ci) => {
        cat.items.forEach((item, ii) => {
          if (saved[sec.id][ci] && saved[sec.id][ci][ii]) {
            item.status = saved[sec.id][ci][ii];
            item.override = true; // manual choice beats derived progress
          }
        });
      });
    }
  });
}

function toggleSol(s, p) {
  const k = key(s, p);
  openSols[k] = !openSols[k];
  render();
}

function showHint(s, p, n) {
  const k = key(s, p);
  if (!hintStates[k]) hintStates[k] = 0;
  if (hintStates[k] < n) hintStates[k] = n;
  render();
}

function saveUserSolution(s, p, text) {
  const k = key(s, p);
  userSolutions[k] = text;
  localStorage.setItem("msolutions", JSON.stringify(userSolutions));
}

function insertLatex(s, p, latex) {
  const ta = document.getElementById('sol-ta-' + key(s, p));
  if (!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const val = ta.value;
  ta.value = val.slice(0, start) + latex + val.slice(end);
  ta.selectionStart = ta.selectionEnd = start + latex.length;
  ta.focus();
  saveUserSolution(s, p, ta.value);
  renderPreview(s, p);
}

function renderPreview(s, p) {
  const ta = document.getElementById('sol-ta-' + key(s, p));
  const prev = document.getElementById('sol-prev-' + key(s, p));
  if (!ta || !prev) return;
  const text = ta.value;
  if (!text.trim()) { prev.innerHTML = '<span style="color:var(--muted)">Your solution will appear here...</span>'; return; }
  prev.innerHTML = R(text);
}

function exportProgress() {

function importProgress(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.sols) { sols = data.sols; localStorage.setItem("msol", JSON.stringify(sols)); }
      if (data.checkStates) { checkStates = data.checkStates; localStorage.setItem("mcheck", JSON.stringify(checkStates)); }
      if (data.userSolutions) { userSolutions = data.userSolutions; localStorage.setItem("msolutions", JSON.stringify(userSolutions)); }
      if (data.mot) { mot = Object.assign({}, DEFAULT_MOT, data.mot); localStorage.setItem("mmot", JSON.stringify(mot)); }
      refreshDay();
      maybeBadges(false);
      syncSave();
loadTopicStates();
syncLoad().then(() => render());
    } catch(err) {
      alert("Invalid progress file.");
    }
  };
  reader.readAsText(file);
  input.value = '';
}
